# The Rust lanes include build scripts, fixtures, toolchain and CI settings.
# Linux checks also read Python sources and repository-wide guard inputs.
# `run` is what the bare `prooft` runner (and `./push`) executes. Local lanes
# are host-only: lint runs first, on the host through `soldr lint` (never under
# bosn), and `--test` adds the native Linux x64 test lane after it. Gates a
# host run cannot prove (cross-target Clippy/Dylint, the `dylint` lane) stay
# unattested, so CI runs them.
version: 1
lanes:
  lint:
    # fmt, host Clippy and host Dylint; stamps rust/all/fmt and the host triple's gates.
    run: [soldr, lint, rust, --check, --host-only]
    inputs: [".cargo/**", ".github/**", ".clippy.toml", ".rustfmt.toml", ".gitattributes", "Cargo.*", "rust-toolchain.toml", "crates/**", "bench/**", "tests/**", "site/**", "ci/**", "python/**", "dylints/**", "pyproject.toml", "uv.lock", "ci.toml", "local-gate.toml", "ci-attestations.yml", "push", ".env", ".intentionally-empty-file.o"]
  dylint:
    # No `run`: the lane's cross-target Dylint is CI's (dylint.yml).
    inputs: [".cargo/**", ".github/**", ".clippy.toml", ".rustfmt.toml", ".gitattributes", "Cargo.*", "rust-toolchain.toml", "crates/**", "bench/**", "tests/**", "site/**", "ci/**", "python/**", "dylints/**", "pyproject.toml", "uv.lock", "ci.toml", "local-gate.toml", "ci-attestations.yml", "push", ".env", ".intentionally-empty-file.o", ".gitignore", "lint", "test"]
  linux-minimal:
    # check-ubuntu.yml's checks and unit tests on the native Linux x64 host,
    # replayed through bosn; the release cross-link (glibc_floor) is off.
    stage: test
    run: [uv, run, --no-project, --python, "3.12", python, -m, ci.local_gate, --lane, linux-minimal]
    inputs: ["**"]
gates:
  rust/all/fmt: {lane: lint, fidelity: native}
  general/all/ubuntu-ci-guards: {lane: linux-minimal, fidelity: native}
  rust/x86_64-unknown-linux-gnu/workspace-clippy: {lane: dylint, fidelity: native}
  rust/x86_64-unknown-linux-gnu/workspace-test: {lane: linux-minimal, fidelity: native}
  rust/x86_64-unknown-linux-gnu/python-facade-test: {lane: linux-minimal, fidelity: native}
  general/all/dylint-policy: {lane: dylint, fidelity: native}
  rust/x86_64-unknown-linux-gnu/dylint-library-check: {lane: dylint, fidelity: native}
  rust/x86_64-unknown-linux-gnu/workspace-dylint: {lane: dylint, fidelity: native}
  # RUST-033 (#1793): cross Clippy and Dylint cover all shipping targets.
  rust/x86_64-unknown-linux-musl/clippy: {lane: lint, fidelity: native}
  rust/x86_64-unknown-linux-musl/dylint: {lane: dylint, fidelity: native}
  rust/aarch64-unknown-linux-musl/clippy: {lane: lint, fidelity: native}
  rust/aarch64-unknown-linux-musl/dylint: {lane: dylint, fidelity: native}
  rust/x86_64-unknown-linux-gnu/clippy: {lane: dylint, fidelity: native}
  rust/x86_64-unknown-linux-gnu/dylint: {lane: dylint, fidelity: native}
  rust/aarch64-unknown-linux-gnu/clippy: {lane: lint, fidelity: native}
  rust/aarch64-unknown-linux-gnu/dylint: {lane: dylint, fidelity: native}
  rust/x86_64-apple-darwin/clippy: {lane: lint, fidelity: native}
  rust/x86_64-apple-darwin/dylint: {lane: dylint, fidelity: native}
  rust/aarch64-apple-darwin/clippy: {lane: lint, fidelity: native}
  rust/aarch64-apple-darwin/dylint: {lane: dylint, fidelity: native}
  rust/x86_64-pc-windows-msvc/clippy: {lane: lint, fidelity: native}
  rust/x86_64-pc-windows-msvc/dylint: {lane: dylint, fidelity: native}
  rust/aarch64-pc-windows-msvc/clippy: {lane: lint, fidelity: native}
  rust/aarch64-pc-windows-msvc/dylint: {lane: dylint, fidelity: native}
jobs:
  fmt.yml:fmt: [rust/all/fmt]
  ci-minimal.yml:linux: [general/all/ubuntu-ci-guards, rust/x86_64-unknown-linux-gnu/workspace-test, rust/x86_64-unknown-linux-gnu/python-facade-test]
  dylint.yml:policy: [general/all/dylint-policy]
  dylint.yml:dylint: [rust/x86_64-unknown-linux-gnu/clippy, rust/x86_64-unknown-linux-gnu/dylint-library-check, rust/x86_64-unknown-linux-gnu/workspace-dylint, rust/x86_64-unknown-linux-gnu/dylint, rust/x86_64-pc-windows-msvc/dylint, rust/x86_64-apple-darwin/dylint]
  dylint.yml:gate: [general/all/dylint-policy, rust/x86_64-unknown-linux-gnu/clippy, rust/x86_64-unknown-linux-gnu/dylint-library-check, rust/x86_64-unknown-linux-gnu/workspace-dylint, rust/x86_64-unknown-linux-gnu/dylint, rust/x86_64-pc-windows-msvc/dylint, rust/x86_64-apple-darwin/dylint]
