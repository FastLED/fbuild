# Coverage registry for `ci` modules that a workflow invokes as a gate.
#
# A gate script enforces a policy with `--fail`; if nothing tests it, the policy
# can be loosened and every job stays green. `ci/gate_script_coverage.py` fails
# when a workflow invokes a module that is not declared here, when a declared
# test path is missing or never mentions its subject, and when `untested` grows
# past the budget pinned in `ci/test_gate_script_coverage.py`.
#
# `untested = []` means the gap is known and still open. Land a test, then
# DELETE the entry -- the guard fails on a stale one. Never add an entry
# without lowering something else: the list only shrinks.
schema = 1

untested = []

[scripts.audit_ignored_tests]
tests = ["ci/test_audit_ignored_tests.py"]

[scripts.build_backend]
# The PEP 517/660 backend every `pip install .` goes through: staleness cache
# key (mtime + cargo profile + non-empty), atomic staging, cargo artifact
# selection, and real wheel assembly (RECORD hashes/modes, METADATA, tag).
tests = ["ci/test_build_backend.py"]

[scripts.build_qemu_linux_runtime]
# The QEMU runtime-library bundle builder: the closure walk/verification run
# for real against a stubbed `ldd`, the constants shared with `esp_qemu*.rs`
# are compared, and the fake-docker path proves an empty or missing artifact
# cannot be hashed and published.
tests = ["ci/test_build_qemu_linux_runtime.py"]

