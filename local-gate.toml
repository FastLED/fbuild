# Optional local proof from a clean committed tree. Hosted CI is authoritative;
# board, extended/full and other native-host coverage remains remote.
[gate]
run = ["uv", "run", "--no-project", "--python", "3.12", "python", "-m", "ci.local_gate"]
verify = "ci-minimal.yml:verify"
# cancel-superseded (GEN-022, ci.yml#409) runs only on merge_group, first, with no `needs:`.
verify-exempt = ["cancel-superseded"]
mode = "shadow"

[gate.lanes.linux-minimal]
run = ["uv", "run", "--no-project", "--python", "3.12", "python", "-m", "ci.local_gate", "--lane", "linux-minimal"]
tools = ["bosn", "uv"]

# Shared proof binds both concrete Ubuntu jobs. The advisory verifier is independent.
[gate.replay]
qualified = true
repository = "FastLED/fbuild"
workflow = "ci-minimal.yml"
mode = "minimal"

[[gate.replay.jobs]]
source-job = "check-ubuntu.yml:check"
key = "linux/Check Ubuntu/Check (ubuntu-latest)"
steps = ["Checkout source", "Verify candidate SHA", "Set up uv", "Select workspace test interpreter", "Setup soldr", "Clippy", "Check tracked Python complexity ratchet", "Test cold-build disk provisioning", "Lint subprocess spawns", "Guard production USB VID/PID catalogue literals", "Test", "Test optional SDK library linkage with native GCC LTO", "Test library assembly and archive policies with native GCC", "Test GNU linker overflow summaries", "Test large library archive"]
lanes = ["linux-minimal"]

[[gate.replay.jobs]]
source-job = "check-ubuntu.yml:python-facade-tests"
key = "linux/Check Ubuntu/Python facade tests (ubuntu-latest)"
steps = ["Checkout source", "Verify candidate SHA", "Set up uv", "Setup soldr", "Run embedded-CPython facade tests", "Test (python facades, --ignored)"]
lanes = ["linux-minimal"]

# The release cross-link is declared but not executed for this lane: ci-minimal
# passes a literal `glibc_floor: false`, so the job exists in the expanded graph
# as a skipped job and derives no required checks. Omitting `steps` is what asks
# for that derivation -- a skipped job must not demand proof it never produces.
[[gate.replay.jobs]]
source-job = "check-ubuntu.yml:glibc-floor"
lanes = ["linux-minimal"]

[[gate.replay.selections]]
lane = "linux-minimal"
job = "linux"
event = "workflow_dispatch"
inputs = {}

[gate.lanes.dylint]
run = ["uv", "run", "--no-project", "--python", "3.12", "python", "-m", "ci.local_gate", "--lane", "dylint"]
tools = ["bosn", "uv"]

[[gate.replay.jobs]]
source-job = "dylint.yml:dylint"
key = "Dylint/Dylint Full (Linux builder, all OS targets)"
steps = ["Checkout source", "Set up uv", "Provision cold-build disk capacity", "Validate Dylint allowlist paths", "Enforce shrink-only .fbuild allowlist", "Validate platform-boundary ledgers", "Setup soldr", "Repair registry sources missing packaged files", "Prepare prebuilt Dylint tools and driver", "Install rustfmt for the Dylint toolchain", "Check Dylint library formatting", "Restore compiled Dylint libraries", "Test Dylint libraries", "Reuse cached Dylint library tree", "Run dylint over workspace", "Save compiled Dylint libraries"]
lanes = ["dylint"]
cache-save-steps = ["Save compiled Dylint libraries"]

[[gate.replay.jobs]]
source-job = "dylint.yml:gate"
key = "Dylint/Dylint"
steps = ["Require successful Dylint jobs"]
lanes = ["dylint"]

[[gate.replay.jobs]]
source-job = "dylint.yml:policy"
key = "Dylint/Dylint policy"
steps = ["Checkout source", "Set up uv", "Validate Dylint policy files"]
lanes = ["dylint"]

# `all-jobs` above selects every job of the standalone Dylint run, including the
# end-of-queue janitor, which its own guard confines to `merge_group`. Declared
# without `steps` so the skipped job derives no required checks.
[[gate.replay.jobs]]
source-job = "dylint.yml:queue-cache-janitor"
lanes = ["dylint"]

[[gate.replay.selections]]
lane = "dylint"
workflow = "dylint.yml"
all-jobs = true
event = "pull_request"
inputs = {}

# RUST-033 (FastLED/fbuild#1793): the whole lint phase as one lane. soldr runs
# rustfmt, Clippy for the host and every declared [workspace.metadata.soldr]
# target, plus Dylint per target through --cross-dylint. One successful run
# attests rust/<target>/{clippy,dylint} for every declared target.
[gate.lanes.lint]
run = ["uv", "run", "--no-project", "--python", "3.12", "python", "-m", "ci.local_gate", "--lane", "lint"]
tools = ["soldr", "uv"]
