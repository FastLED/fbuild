# Optional local proof from a clean committed tree. Hosted CI is authoritative;
# board, extended/full and other native-host coverage remains remote.
[gate]
run = ["uv", "run", "--no-project", "--python", "3.12", "python", "-m", "ci.local_gate"]
verify = "ci-minimal.yml:verify"
# cancel-superseded (GEN-022, ci.yml#409) runs only on merge_group, first, with no `needs:`.
verify-exempt = ["cancel-superseded", "prooft"]
mode = "shadow"

[gate.lanes.linux-minimal]
run = ["uv", "run", "--no-project", "--python", "3.12", "python", "-m", "ci.local_gate", "--lane", "linux-minimal"]
tools = ["bosn", "uv"]

# Shared proof binds both concrete Ubuntu jobs. The advisory verifier is independent.
[gate.replay]
qualified = true
repository = "FastLED/fbuild"
workflow = "ci-minimal.yml"
mode = "minimal"

[[gate.replay.jobs]]
source-job = "check-ubuntu.yml:check"
key = "Check (ubuntu-latest)"
steps = ["Checkout source", "Verify candidate SHA", "Set up uv", "Select workspace test interpreter", "Setup soldr", "Clippy", "Check tracked Python complexity ratchet", "Check tracked Python types", "Test cold-build disk provisioning", "Lint subprocess spawns", "Guard production USB VID/PID catalogue literals", "Test", "Test optional SDK library linkage with native GCC LTO", "Test library assembly and archive policies with native GCC", "Test GNU linker overflow summaries", "Test large library archive"]
lanes = ["linux-minimal"]

[[gate.replay.jobs]]
source-job = "check-ubuntu.yml:python-facade-tests"
key = "Python facade tests (ubuntu-latest)"
steps = ["Checkout source", "Verify candidate SHA", "Set up uv", "Setup soldr", "Run embedded-CPython facade tests", "Test (python facades, --ignored)"]
lanes = ["linux-minimal"]

# The release cross-link is declared but the replay disables it with
# `glibc_floor: false`, so the job exists in the expanded graph
# as a skipped job and derives no required checks. Omitting `steps` is what asks
# for that derivation -- a skipped job must not demand proof it never produces.
[[gate.replay.jobs]]
source-job = "check-ubuntu.yml:glibc-floor"
lanes = ["linux-minimal"]

[[gate.replay.selections]]
lane = "linux-minimal"
workflow = "check-ubuntu.yml"
all-jobs = true
event = "workflow_dispatch"
inputs = { glibc_floor = "false" }

# Lint never runs under bosn; `soldr lint` is the only local linter. This host
# lane runs dylint.yml's policy validators through uv, each lint library's
# formatting and UI tests through `soldr cargo`, then `soldr lint rust --check
# --cross-dylint` over the workspace for every declared target. It produces no
# act2 replay report, so the hosted Dylint jobs are not replay-mapped here;
# ci-attestations.yml binds their gates to this lane.
[gate.lanes.dylint]
run = ["uv", "run", "--no-project", "--python", "3.12", "python", "-m", "ci.local_gate", "--lane", "dylint"]
tools = ["soldr", "uv"]

# RUST-033 (FastLED/fbuild#1793): the whole lint phase as one lane. soldr runs
# rustfmt, Clippy for the host and every declared [workspace.metadata.soldr]
# target, plus Dylint per target through --cross-dylint. One successful run
# attests rust/<target>/{clippy,dylint} for every declared target.
[gate.lanes.lint]
run = ["uv", "run", "--no-project", "--python", "3.12", "python", "-m", "ci.local_gate", "--lane", "lint"]
tools = ["soldr", "uv"]
