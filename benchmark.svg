<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title description">
  <title id="title">Arduino Uno and ESP32-S3 Blink build benchmark</title>
  <desc id="description">Cold build bars with narrower warm build timing overlays for Arduino Uno and ESP32-S3 Blink sketches.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .heading { font-size: 30px; font-weight: 700; fill: #f0f6fc; }
    .meta { font-size: 14px; fill: #8b949e; }
    .legend { font-size: 14px; font-weight: 600; fill: #c9d1d9; }
    .tool { font-size: 18px; font-weight: 700; }
    .value { font-size: 14px; font-weight: 600; fill: #f0f6fc; }
    .speed { font-size: 13px; fill: #8b949e; }
  </style>
  <rect width="960" height="700" fill="#0d1117" />
  <rect width="960" height="112" fill="#161b22" />
  <text x="24" y="43" class="heading">Arduino Uno + ESP32-S3 Blink build times</text>
  <text x="24" y="72" class="meta">Arduino CLI vs PlatformIO vs fbuild | median of 3 trials</text>
  <text x="24" y="95" class="meta">Generated 2026-09-26T22:03:01Z | sha e76cc5195a43</text>
  <text x="692" y="95" class="meta">raw compiler floor: 173.5 ms | fbuild overhead: 160.2 ms | fbuild/PIO cold: 0.480</text>
  <rect x="24" y="128" width="76" height="24" rx="4" fill="#5b1f1c" />
  <rect x="24" y="134" width="34" height="12" rx="3" fill="#f85149" />
  <text x="112" y="146" class="legend">cold (back) + warm (front overlay)</text>
  <text x="24" y="182" class="legend">Arduino Uno | scale: slowest median = 695.2 ms</text>
  <text x="24" y="428" class="legend">ESP32-S3 | scale: slowest median = 12517.7 ms</text>
