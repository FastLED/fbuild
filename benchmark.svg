  <text x="24" y="95" class="meta">Generated 2026-11-05T06:10:33Z | sha 33d538a02260</text>
  <text x="692" y="95" class="meta">raw compiler floor: 208.5 ms | fbuild overhead: 281.5 ms | fbuild/PIO cold: 0.596</text>
  <rect x="24" y="128" width="76" height="24" rx="4" fill="#5b1f1c" />
  <rect x="24" y="134" width="34" height="12" rx="3" fill="#f85149" />
  <text x="112" y="146" class="legend">cold (back) + warm (front overlay)</text>
