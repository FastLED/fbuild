[package]
name = "fbuild-core"
description = "Core types, errors, and utilities for fbuild"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published to crates.io — distribution is PyPI + GitHub Releases;
# this member exists purely for internal compile parallelism. FastLED/fbuild#1008.
publish = false

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Runtime decompression for the downloaded FastLED/boards cache.
zstd = { workspace = true }
prost = { workspace = true }
# Cross-platform containment and detached-spawn implementation delegated by
# `platform::process`. Its source and revision intentionally match zccache's
# copy so exported-symbol ownership remains unique. See FastLED/fbuild#32.
running-process = { workspace = true }
# Async helpers for the Tokio integration in `platform::process` —
# we need the `process` feature so `tokio::process::Command` is in scope.
# Also drives the async `subprocess::run_command*` surface introduced
# in the full-async runtime conversion (#813).
tokio = { workspace = true }
# Used by future async trait surfaces folded under this crate. Added in
# the #813 Phase A foundation so downstream crates can `use async_trait`
# without each one redeclaring the workspace dep.
async-trait = { workspace = true }
# Shared HTTP client bridge (FastLED/fbuild#844). The `client()`
# constructor is hoisted from fbuild-packages so every reqwest call site
# in the workspace has one source of truth. See `src/http.rs` and the
# matching `ban_bare_reqwest` dylint.
reqwest = { workspace = true }
# Cross-process shared/exclusive fbuild-daemon lifecycle gates. These are not
# used for zccache object access. Locks are released if a process exits.
fs2 = { workspace = true }
# Stable cross-platform file identity handles; construction remains confined
# to the selected filesystem implementation.
same-file = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Selected Unix filesystem mechanics query the exact mount containing a path.
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Selected Windows filesystem mechanics: removable-volume facts and retiring
# a kernel-blocked output handle after its watchdog expires.
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tempfile = { workspace = true }
# Test-only embedded USB-vendor fixture extraction. Production never links it.
tar = { workspace = true }
