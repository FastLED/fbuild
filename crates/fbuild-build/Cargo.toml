[package]
name = "fbuild-build"
description = "Build orchestration, compilation, linking for all platforms (AVR, ESP32, RP2040, STM32, Teensy, WASM)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published to crates.io — distribution is PyPI + GitHub Releases;
# this member exists purely for internal compile parallelism. FastLED/fbuild#1008.
publish = false

[dependencies]
# The shared build engine (pipeline, compiler, linker, analyzers, traits) and
# the three per-family platform crates. FastLED/fbuild#1008 — this crate is now
# a thin facade re-exporting all four + the get_platform_support() factory.
fbuild-build-engine = { path = "../fbuild-build-engine" }
fbuild-build-esp = { path = "../fbuild-build-esp" }
fbuild-build-arm = { path = "../fbuild-build-arm" }
fbuild-build-mcu = { path = "../fbuild-build-mcu" }
fbuild-core = { path = "../fbuild-core" }
fbuild-config = { path = "../fbuild-config" }
fbuild-paths = { path = "../fbuild-paths" }
fbuild-packages = { path = "../fbuild-packages" }
fbuild-library-select = { path = "../fbuild-library-select" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
walkdir = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
tempfile = { workspace = true }
object = { workspace = true }
owo-colors = { workspace = true }
reqwest = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-cpp = { workspace = true }

# FastLED/fbuild#800 (Phase 4 stage 2 of #789): zccache embedded
# library is an unconditional dep. The wrapper-binary path
# (`crates/fbuild-build/src/managed_zccache.rs`, `zccache wrap …`
# child processes) was deleted in the same PR; there is no
# `--no-default-features` escape hatch.
#
# Pinned at zccache 1.12.17 (`5ee292f`, upstream main). soldr's
# `_vender/zccache` submodule currently sits 3 commits behind this at
# `4180af8`; both revs speak the same shared-broker protocol, so the two
# embedded services still interoperate. Re-check that submodule when
# repinning — a protocol-affecting zccache change must land in both.
#
# `running-process` in the workspace root must be pinned to the SAME git rev
# zccache uses, or its unmangled `rp_*_public` C symbols get linked twice.
zccache = { git = "https://github.com/zackees/zccache", rev = "5ee292ff61e0f5909e1893916efe3bd963db8032" }

[dev-dependencies]
filetime = { workspace = true }
fbuild-test-support = { path = "../fbuild-test-support" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
