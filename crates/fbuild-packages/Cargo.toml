[package]
name = "fbuild-packages"
description = "Package management, toolchain resolution, library downloads for fbuild"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published to crates.io — distribution is PyPI + GitHub Releases;
# this member exists purely for internal compile parallelism. FastLED/fbuild#1008.
publish = false

# The lib has no unit tests (its tests live in tests/it), so don't build and
# link an empty harness. FastLED/fbuild#1577; ci/check_test_layout.py fails if
# a #[test] is added to src/ while this is set.
[lib]
test = false

[dependencies]
# FastLED/fbuild#1008 Phase B — this crate is now a thin facade re-exporting
# the fetch primitives + the parallel library / toolchain crates.
fbuild-packages-fetch = { path = "../fbuild-packages-fetch" }
fbuild-library = { path = "../fbuild-library" }
fbuild-toolchain = { path = "../fbuild-toolchain" }
fbuild-core = { path = "../fbuild-core" }
fbuild-paths = { path = "../fbuild-paths" }
fbuild-config = { path = "../fbuild-config" }
async-trait = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }
xz2 = { workspace = true }
bzip2 = { workspace = true }
zstd = { workspace = true }
semver = { workspace = true }
rusqlite = { workspace = true }
walkdir = { workspace = true }
prost = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
