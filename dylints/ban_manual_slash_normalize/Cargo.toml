[package]
name = "ban_manual_slash_normalize"
# Bump the version to bust the dylint .so cache when allowlist.txt
# changes (setup-soldr's dylint-cache key hashes the manifest but not
# src/allowlist.txt). Same convention ban_std_pathbuf follows.
version = "0.1.0"
description = "Ban manual '.replace(\\, /)' backslash-to-slash rewrites"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Dylint 6.0.1 includes the rustc_session compatibility needed by this nightly.
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"

[package.metadata.rust-analyzer]
rustc_private = true
