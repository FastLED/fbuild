[package]
name = "ban_std_sync_mutex_in_async"
version = "0.1.0"
description = "Ban std::sync::Mutex / std::sync::RwLock in async-reachable fbuild code (daemon, serial)"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep the library and test harness on the repository-wide Dylint release.
dylint_linting = "=6.0.1"

[dev-dependencies]
dylint_testing = "=6.0.1"

[package.metadata.rust-analyzer]
rustc_private = true
