[package]
name = "ban_unwrap_in_production"
version = "0.1.0"
description = "Ban .unwrap() inside fbuild production code (daemon + cli/cli/**)"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep the library and test harness on the repository-wide Dylint release.
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"

[package.metadata.rust-analyzer]
rustc_private = true