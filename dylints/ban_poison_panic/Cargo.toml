[package]
name = "ban_poison_panic"
version = "0.1.0"
description = "Ban .unwrap()/.expect() on std::sync::Mutex/RwLock lock guards"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "=6.2.0"

[dev-dependencies]
dylint_testing = "=6.2.0"

[package.metadata.rust-analyzer]
rustc_private = true
