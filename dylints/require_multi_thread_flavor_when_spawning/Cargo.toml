[package]
name = "require_multi_thread_flavor_when_spawning"
version = "0.1.0"
description = "Require tokio::test(flavor = \"multi_thread\") when the test body calls tokio::spawn"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep the library and test harness on the repository-wide Dylint release.
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"

[package.metadata.rust-analyzer]
rustc_private = true
