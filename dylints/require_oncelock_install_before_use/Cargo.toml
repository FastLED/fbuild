[package]
name = "require_oncelock_install_before_use"
# Bump whenever the embedded allowlist changes so the Dylint cache is invalidated.
version = "0.1.1"
description = "Require OnceLock::set/set_blocking install sites to live in binary entry points (FastLED/fbuild#840)"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "=6.0.1"

[dev-dependencies]
dylint_testing = "=6.0.1"

[package.metadata.rust-analyzer]
rustc_private = true
