[package]
name = "cli_no_build_deploy_direct_use"
version = "0.1.0"
description = "Forbid fbuild-cli from importing fbuild-build / fbuild-deploy outside the diagnostic-subcommand allowlist"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep the library and test harness on the repository-wide Dylint release.
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"

[package.metadata.rust-analyzer]
rustc_private = true
