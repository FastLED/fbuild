[package]
name = "ban_direct_serialport"
version = "0.1.0"
description = "Ban direct use of the serialport crate outside fbuild-serial"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep the library and test harness on the repository-wide Dylint release.
dylint_linting = "=6.0.1"

[dev-dependencies]
dylint_testing = "=6.0.1"

[package.metadata.rust-analyzer]
rustc_private = true
