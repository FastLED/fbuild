[package]
name = "ban_raw_subprocess"
# Bump whenever the embedded allowlist changes so the Dylint cache is invalidated.
version = "0.1.2"
description = "Ban raw std/tokio Command spawn/output/status in fbuild production code"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep the library and test harness on the repository-wide Dylint release.
dylint_linting = "=6.0.1"

[dev-dependencies]
dylint_testing = "=6.0.1"

[package.metadata.rust-analyzer]
rustc_private = true
