[package]
name = "ban_unrooted_tempdir"
# 2026-06-15: bumped to bust the dylint .so cache when allowlist.txt
# changes — see ban_std_pathbuf for the same workaround rationale.
version = "0.2.0"
description = "Ban tempdir/temp_dir calls that aren't rooted under fbuild's cache dir"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep the library and test harness on the repository-wide Dylint release.
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"

[package.metadata.rust-analyzer]
rustc_private = true
