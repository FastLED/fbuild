[project]
name = "fbuild"
version = "2.5.47"
description = "PlatformIO-compatible embedded build tool (Rust implementation)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
# FastLED/fbuild#800: fbuild's daemon hosts an in-process zccache
# service (see `crates/fbuild-build/src/zccache_embedded.rs`). The
# library dep is pinned in `crates/fbuild-build/Cargo.toml`, NOT here
# — fbuild does not declare zccache as a Python distribution dep, and
# the legacy "pinned managed binary download" path was deleted along
# with `MANAGED_ZCCACHE_VERSION`.
dependencies = []

# `fbuild` on PATH is the native cargo-built binary itself, shipped as a
# raw wheel script (`.data/scripts/` in ci/build_backend.py). No
# Python wrapper sits in front of it — `cmd → fbuild → stdout`. See
# ci/build_backend.py and #746 for why we don't use `[project.scripts]` (PEP 621
# only supports Python entry points, which on Windows go through an
# `os.execv` emulation that races the next shell prompt ahead of stdout).

[dependency-groups]
# `soldr` is a globally installed executable, not a project-venv dependency.
dev = ["fbuild-dev-tools"]

[tool.uv.sources]
fbuild-dev-tools = { path = "ci/dev-tools", editable = true }

# Skip PEP 517 build isolation for fbuild: the in-tree backend has no
# build requirements, so an isolated env would only add overhead. The
# backend always runs against this checkout (staged artifacts in `ci/bin/`
# and a per-repo persistent CARGO_TARGET_DIR under ~/.fbuild).
[tool.uv]
no-build-isolation-package = ["fbuild"]
default-groups = ["dev"]
# The backend invokes the globally installed `soldr` executable for Rust
# builds.
# Tell uv to re-sync the editable install when these change. Without
# this, `uv run` after a .rs edit silently uses a stale _native.pyd
# because uv's default cache-keys only watch pyproject.toml.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
    # The backend's own staleness check also watches the toolchain pin, and
    # the backend itself decides what goes into the wheel.
    { file = "rust-toolchain.toml" },
    { file = "ci/build_backend.py" },
    # A `git pull` to a new HEAD is a new key even if mtimes say otherwise
    # (FastLED/fbuild editable installs once kept the previous day's binaries).
    { git = { commit = true } },
]

# In-tree backend (ci/build_backend.py): no build requirements, so pip's
# isolated build env is empty, and the wheel is written in one stored pass.
# It calls the globally installed `soldr cargo` executable. Local/source
# installs use the fast dev profile by default; set FBUILD_BUILD_RELEASE=1 for
# an optimized source build.
[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["ci"]

[tool.ruff.lint]
select = ["C901", "RUF100"]
external = ["D401", "E402", "F401"]

[tool.ruff.lint.mccabe]
max-complexity = 10
