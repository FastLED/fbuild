[env:esp8266]
# Can now use abbreviated PlatformIO format instead of full URL!
# Any of these formats work:
#   platform = espressif8266@4.2.1
#   platform = platformio/espressif8266@4.2.1
#   platform = https://github.com/platformio/platform-espressif8266/archive/refs/tags/v4.2.1.zip
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino

# Registry-pin regression fixture (FastLED/fbuild#1496): Arduino core 3.0.2
# and PlatformIO's matching Xtensa GCC/SDK, not fbuild's 3.1.2 default.
[env:esp8266-401]
extends = env:esp8266
platform = espressif8266@4.0.1
