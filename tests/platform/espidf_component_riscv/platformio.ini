; One project, one environment per RISC-V chip the delegated ESP-IDF build
; serves. Every environment opts in with `board_build.build_system = espidf`;
; without it fbuild refuses a bare `framework = espidf` (FastLED/fbuild#1730).
[env]
platform = espressif32
framework = espidf
board_build.build_system = espidf

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:esp32c5]
board = esp32-c5-devkitc-1

[env:esp32c6]
board = esp32-c6-devkitc-1

; Pre-rev-3 silicon ("esp32p4_es"): revisions up to 1.99.
[env:esp32p4]
board = esp32-p4-evboard

; Rev-3 silicon: built for the rev-3 family (CONFIG_ESP32P4_REV_MIN_FULL=300)
; from the same release (FastLED/fbuild#2133).
[env:esp32p4-r3]
board = esp32-p4_r3
