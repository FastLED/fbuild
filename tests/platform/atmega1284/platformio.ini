; PlatformIO Project Configuration File
;
; ATmega1284P (Microduino Core+, `1284p16m`) smoke fixture for the
; ATmega644/1284 class (FastLED/fbuild#389, source FastLED/FastLED#1253).
;
; The board declares core = arduino, variant = microduino_plus. Like
; PlatformIO, fbuild builds core = arduino against PlatformIO's repacked
; `framework-arduino-avr` (5.4.0, pinned in
; crates/fbuild-library/assets/avr_frameworks.json), which ships the
; microduino_plus variant; upstream ArduinoCore-avr does not.

[env:atmega1284]
platform = atmelavr
board = 1284p16m
framework = arduino
