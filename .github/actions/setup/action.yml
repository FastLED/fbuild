name: "Set up fbuild"
description: "Install fbuild and configure its cache for save/restore across CI runs."
author: "FastLED"
branding:
  icon: "zap"
  color: "yellow"

inputs:
  fbuild-version:
    description: "fbuild version to install from PyPI. 'latest' pulls the newest release."
    required: false
    default: "latest"
  python-version:
    description: "Python version used to install fbuild. Must be >= 3.10."
    required: false
    default: "3.10"
  cache:
    description: "Whether to save/restore the fbuild cache via actions/cache. Set to 'false' to skip caching (install only)."
    required: false
    default: "true"
  cache-mode:
    description: "'combined' (default) keeps one FBUILD_CACHE_DIR entry per key. 'split' restores a packages cache shared per platform family plus a per-board build-payload cache, and runs `fbuild install` as its own step (FastLED/fbuild#1433). 'split' needs `environments` and an fbuild release with `fbuild install`."
    required: false
    default: "combined"
  save:
    description: "Whether to save caches. 'false' only restores; use it on pull requests so PR runs don't add entries of their own to the repository's cache budget."
    required: false
    default: "true"
  project-dir:
    description: "Project directory passed to `fbuild install` in split mode."
    required: false
    default: "."
  environments:
    description: "Space-separated environments to provision with `fbuild install` in split mode."
    required: false
    default: ""
  board:
    description: "Name for the per-board build-payload cache key in split mode. Defaults to `environments` joined with '_'."
    required: false
    default: ""
  cache-key-extra:
    description: "Extra string baked into the cache key. Typically hashFiles('platformio.ini', ...) so graph-input changes invalidate stale artifacts."
    required: false
    default: ""
  cache-version:
    description: "Manual bump to force-invalidate the cache without changing any inputs. Increment this string (or bump in a workflow env) when cache needs busting."
    required: false
    default: "v1"
  cache-dir:
    description: "Override the cache directory. Default: $RUNNER_TEMP/fbuild-cache (runner-stable, survives across steps of the same job)."
    required: false
    default: ""
  install-cache-key-extra:
    description: "Extra string baked into the install cache key (separate from the build artifact cache). Use hashFiles('pyproject.toml') so a pin bump invalidates the cached binary. The install cache is intentionally board/platform-independent so it's shared across every job in a repo's matrix."
    required: false
    default: ""

outputs:
  cache-hit:
    description: "Combined mode: true if the fbuild cache was restored from an exact key match, false otherwise."
    value: ${{ steps.fbuild-cache.outputs.cache-hit || steps.fbuild-cache-restore-only.outputs.cache-hit }}
  cache-dir:
    description: "Resolved cache directory path (useful for diagnostic steps)."
    value: ${{ steps.resolve-paths.outputs.cache-dir }}
  zccache-store-path:
    description: "Resolved zccache store path exported as ZCCACHE_DIR for downstream actions/cache steps."
    value: ${{ steps.resolve-paths.outputs.zccache-store-path }}
  fbuild-hash:
    description: "sha256 prefix of the installed fbuild wheel's RECORD file. Baked into the cache key so an fbuild upgrade invalidates stale artifacts."
    value: ${{ steps.fbuild-hash.outputs.fbuild-hash }}
  platform-family:
    description: "Split mode: the platform family (e.g. 'espressif32') the packages cache is shared across."
    value: ${{ steps.split-plan.outputs.family }}
  packages-hash:
    description: "Split mode: `packages_hash` reported by `fbuild install --json` for the provisioned environments."
    value: ${{ steps.split-install.outputs.packages-hash }}
  packages-cache-hit:
    description: "Split mode: the packages cache key that was restored, or empty on a miss."
    value: ${{ steps.packages-restore.outputs.cache-matched-key }}
  build-cache-hit:
    description: "Split mode: true if the per-board build-payload cache was restored from an exact key match."
    value: ${{ steps.build-cache.outputs.cache-hit || steps.build-cache-restore-only.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Resolve cache directories and fbuild install target
      id: resolve-paths
      shell: bash
      run: |
        set -euo pipefail

        if [ -n "${{ inputs.cache-dir }}" ]; then
          CACHE_DIR="${{ inputs.cache-dir }}"
        else
          CACHE_DIR="${RUNNER_TEMP}/fbuild-cache"
        fi
        ZCCACHE_DIR="${RUNNER_TEMP}/zccache"
        # Isolated --target dir for the fbuild wheel install. Caching this
        # directory directly (instead of the hosted Python's site-packages)
        # keeps the cache scoped, deterministic, and immune to whatever
        # else other steps install into the system interpreter.
        INSTALL_DIR="${RUNNER_TEMP}/fbuild-install"
        mkdir -p "$CACHE_DIR" "$ZCCACHE_DIR" "$INSTALL_DIR"

        # Exported for every subsequent step in the user's job.
        echo "FBUILD_CACHE_DIR=$CACHE_DIR" >> "$GITHUB_ENV"
        echo "ZCCACHE_DIR=$ZCCACHE_DIR" >> "$GITHUB_ENV"
        echo "cache-dir=$CACHE_DIR" >> "$GITHUB_OUTPUT"
        echo "zccache-store-path=$ZCCACHE_DIR" >> "$GITHUB_OUTPUT"
        echo "install-dir=$INSTALL_DIR" >> "$GITHUB_OUTPUT"

        if [ "${{ inputs.fbuild-version }}" = "latest" ]; then
          echo "pip-spec=fbuild" >> "$GITHUB_OUTPUT"
        else
          echo "pip-spec=fbuild==${{ inputs.fbuild-version }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore fbuild install cache
      id: fbuild-install-cache
      uses: actions/cache@v5
      with:
        # Cache the entire isolated --target install directory. The fbuild
        # wheel has zero PyPI deps (verified on PyPI), so caching this dir
        # is enough — no separate dependency tree to track.
        path: ${{ steps.resolve-paths.outputs.install-dir }}
        # Key is intentionally board/platform-INDEPENDENT (no cache-key-extra)
        # so every job in a repo's board matrix shares the same install cache.
        # `install-cache-key-extra` is the consumer-supplied hash — typically
        # hashFiles('pyproject.toml') — so a pin bump invalidates the cached
        # binary across the whole repo at once.
        key: fbuild-install-${{ inputs.cache-version }}-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}-${{ steps.resolve-paths.outputs.pip-spec }}-${{ inputs.install-cache-key-extra }}
        restore-keys: |
          fbuild-install-${{ inputs.cache-version }}-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}-${{ steps.resolve-paths.outputs.pip-spec }}-

    - name: Install fbuild
      if: steps.fbuild-install-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # --target installs into a single isolated dir we can cache cleanly.
        # No --upgrade pip — that step alone took ~1s before and has zero
        # functional impact on installing one wheel with no deps.
        python -m pip install --target "${{ steps.resolve-paths.outputs.install-dir }}" '${{ steps.resolve-paths.outputs.pip-spec }}'

    - name: Activate fbuild from install dir
      shell: bash
      run: |
        set -euo pipefail
        INSTALL_DIR="${{ steps.resolve-paths.outputs.install-dir }}"
        # `pip install --target` drops console scripts in <target>/bin on
        # POSIX and <target>/Scripts on Windows. Add both to GITHUB_PATH so
        # the same action.yml works across runner.os without branching.
        echo "$INSTALL_DIR/bin" >> "$GITHUB_PATH"
        echo "$INSTALL_DIR/Scripts" >> "$GITHUB_PATH"
        # Python needs to see the --target-installed package on import,
        # otherwise `fbuild` (a console script) fails at module resolution
        # despite being on PATH. Prepend, don't replace, any existing
        # PYTHONPATH so downstream steps' Python imports keep working.
        if [ -n "${PYTHONPATH:-}" ]; then
          echo "PYTHONPATH=$INSTALL_DIR:$PYTHONPATH" >> "$GITHUB_ENV"
        else
          echo "PYTHONPATH=$INSTALL_DIR" >> "$GITHUB_ENV"
        fi
        # Smoke test using the resolved binary, not `fbuild` from PATH
        # (GITHUB_PATH writes only take effect in subsequent steps).
        if [ -x "$INSTALL_DIR/bin/fbuild" ]; then
          PYTHONPATH="$INSTALL_DIR${PYTHONPATH:+:$PYTHONPATH}" "$INSTALL_DIR/bin/fbuild" --version \
            || echo "fbuild --version not yet supported on this release" >&2
        elif [ -x "$INSTALL_DIR/Scripts/fbuild.exe" ]; then
          PYTHONPATH="$INSTALL_DIR${PYTHONPATH:+;$PYTHONPATH}" "$INSTALL_DIR/Scripts/fbuild.exe" --version \
            || echo "fbuild --version not yet supported on this release" >&2
        else
          echo "::error::fbuild binary not found in $INSTALL_DIR/{bin,Scripts}; cache likely corrupt" >&2
          ls -la "$INSTALL_DIR" >&2 || true
          exit 1
        fi

    - name: Resolve fbuild content hash
      id: fbuild-hash
      shell: bash
      run: |
        set -euo pipefail
        # Cache correctness depends on the EXACT installed fbuild, not just the
        # PyPI version string. Hash the wheel's dist-info RECORD file — it
        # contains sha256s of every installed file, so any change to fbuild
        # (re-released wheel, local build, different platform tag) produces a
        # different digest. See docs/CI_CACHING.md "Cache-key strategy".
        FBUILD_HASH=$(python - <<'PY'
        import hashlib
        import importlib.metadata as md
        import sys
        try:
            dist = md.distribution("fbuild")
        except md.PackageNotFoundError:
            sys.exit("fbuild is not installed; cannot resolve content hash")
        record = dist.read_text("RECORD")
        if not record:
            # Fallback: hash version + metadata so we at least discriminate by release.
            record = f"{dist.version}\n{dist.read_text('METADATA') or ''}"
        print(hashlib.sha256(record.encode("utf-8")).hexdigest()[:16])
        PY
        )
        echo "fbuild-hash=${FBUILD_HASH}" >> "$GITHUB_OUTPUT"
        echo "Resolved fbuild content hash: ${FBUILD_HASH}"

    # ── Combined mode (default): one FBUILD_CACHE_DIR entry per key ─────────

    - name: Restore fbuild cache
      if: ${{ inputs.cache == 'true' && inputs.cache-mode != 'split' && inputs.save == 'true' }}
      id: fbuild-cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.resolve-paths.outputs.cache-dir }}
        key: fbuild-${{ inputs.cache-version }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.fbuild-hash.outputs.fbuild-hash }}-${{ inputs.cache-key-extra }}
        restore-keys: |
          fbuild-${{ inputs.cache-version }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.fbuild-hash.outputs.fbuild-hash }}-
          fbuild-${{ inputs.cache-version }}-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore fbuild cache (no save)
      if: ${{ inputs.cache == 'true' && inputs.cache-mode != 'split' && inputs.save != 'true' }}
      id: fbuild-cache-restore-only
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.resolve-paths.outputs.cache-dir }}
        key: fbuild-${{ inputs.cache-version }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.fbuild-hash.outputs.fbuild-hash }}-${{ inputs.cache-key-extra }}
        restore-keys: |
          fbuild-${{ inputs.cache-version }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.fbuild-hash.outputs.fbuild-hash }}-
          fbuild-${{ inputs.cache-version }}-${{ runner.os }}-${{ runner.arch }}-

    # ── Split mode (FastLED/fbuild#1433) ───────────────────────────────────
    # Packages (toolchains, platforms, frameworks, libraries) are shared per
    # platform family and saved as soon as `fbuild install` finishes: they do
    # not change during the build. Build payloads (core objects, framework
    # library archives, library selection, the zccache store) are per board
    # and saved at the end of the job. Neither falls back across boards, so a
    # board's entry never grows into an all-toolchain blob.

    - name: Plan split fbuild caches
      if: ${{ inputs.cache-mode == 'split' }}
      id: split-plan
      shell: bash
      env:
        FBUILD_PROJECT_DIR: ${{ inputs.project-dir }}
        FBUILD_ENVIRONMENTS: ${{ inputs.environments }}
        FBUILD_BOARD: ${{ inputs.board }}
      run: |
        set -euo pipefail
        read -r -a envs <<< "$FBUILD_ENVIRONMENTS"
        if [ "${#envs[@]}" -eq 0 ]; then
          echo "::error::cache-mode: split needs the 'environments' input" >&2
          exit 1
        fi
        env_args=()
        for env in "${envs[@]}"; do env_args+=(-e "$env"); done
        # A dry run resolves the package set without touching the network;
        # it names each env's platform before anything is restored.
        plan="${RUNNER_TEMP}/fbuild-install-plan.json"
        fbuild install "$FBUILD_PROJECT_DIR" "${env_args[@]}" --dry-run --json > "$plan"
        family=$(python -c 'import json,sys; print("-".join(sorted({e["platform"].lower() for e in json.load(open(sys.argv[1]))["environments"]})))' "$plan")
        board="${FBUILD_BOARD:-$(IFS=_; echo "${envs[*]}")}"
        echo "family=${family}" >> "$GITHUB_OUTPUT"
        echo "board=${board}" >> "$GITHUB_OUTPUT"
        echo "Platform family: ${family}; board payload key: ${board}"

    - name: Restore fbuild packages cache
      if: ${{ inputs.cache == 'true' && inputs.cache-mode == 'split' }}
      id: packages-restore
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ steps.resolve-paths.outputs.cache-dir }}/toolchains
          ${{ steps.resolve-paths.outputs.cache-dir }}/platforms
          ${{ steps.resolve-paths.outputs.cache-dir }}/packages
          ${{ steps.resolve-paths.outputs.cache-dir }}/libraries
          ${{ steps.resolve-paths.outputs.cache-dir }}/archives
          ${{ steps.resolve-paths.outputs.cache-dir }}/installed
          ${{ steps.resolve-paths.outputs.cache-dir }}/index.sqlite
        # Saved keys end in the packages_hash, which is unknown until install
        # runs; restore the newest entry for this platform family by prefix.
        key: fbuild-pkgs-${{ inputs.cache-version }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.split-plan.outputs.family }}-restore
        restore-keys: |
          fbuild-pkgs-${{ inputs.cache-version }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.split-plan.outputs.family }}-

    - name: Install fbuild packages
      if: ${{ inputs.cache-mode == 'split' }}
      id: split-install
      shell: bash
      env:
        FBUILD_PROJECT_DIR: ${{ inputs.project-dir }}
        FBUILD_ENVIRONMENTS: ${{ inputs.environments }}
        FBUILD_PACKAGES_KEY_PREFIX: fbuild-pkgs-${{ inputs.cache-version }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.split-plan.outputs.family }}-
      run: |
        set -euo pipefail
        read -r -a envs <<< "$FBUILD_ENVIRONMENTS"
        env_args=()
        for env in "${envs[@]}"; do env_args+=(-e "$env"); done
        manifest="${RUNNER_TEMP}/fbuild-install.json"
        fbuild install "$FBUILD_PROJECT_DIR" "${env_args[@]}" --json > "$manifest"
        cat "$manifest"
        hash=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["packages_hash"])' "$manifest")
        echo "packages-hash=${hash}" >> "$GITHUB_OUTPUT"
        echo "packages-key=${FBUILD_PACKAGES_KEY_PREFIX}${hash}" >> "$GITHUB_OUTPUT"

    - name: Save fbuild packages cache
      if: ${{ inputs.cache == 'true' && inputs.cache-mode == 'split' && inputs.save == 'true' && steps.packages-restore.outputs.cache-matched-key != steps.split-install.outputs.packages-key }}
      uses: actions/cache/save@v5
      with:
        path: |
          ${{ steps.resolve-paths.outputs.cache-dir }}/toolchains
          ${{ steps.resolve-paths.outputs.cache-dir }}/platforms
          ${{ steps.resolve-paths.outputs.cache-dir }}/packages
          ${{ steps.resolve-paths.outputs.cache-dir }}/libraries
          ${{ steps.resolve-paths.outputs.cache-dir }}/archives
          ${{ steps.resolve-paths.outputs.cache-dir }}/installed
          ${{ steps.resolve-paths.outputs.cache-dir }}/index.sqlite
        key: ${{ steps.split-install.outputs.packages-key }}

    - name: Restore fbuild build-payload cache
      if: ${{ inputs.cache == 'true' && inputs.cache-mode == 'split' && inputs.save == 'true' }}
      id: build-cache
      uses: actions/cache@v5
      with:
        path: |
          ${{ steps.resolve-paths.outputs.cache-dir }}/core
          ${{ steps.resolve-paths.outputs.cache-dir }}/framework-libs
          ${{ steps.resolve-paths.outputs.cache-dir }}/library-selection
          ${{ steps.resolve-paths.outputs.zccache-store-path }}
        key: fbuild-build-${{ inputs.cache-version }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.fbuild-hash.outputs.fbuild-hash }}-${{ steps.split-plan.outputs.board }}-${{ inputs.cache-key-extra }}
        restore-keys: |
          fbuild-build-${{ inputs.cache-version }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.fbuild-hash.outputs.fbuild-hash }}-${{ steps.split-plan.outputs.board }}-

    - name: Restore fbuild build-payload cache (no save)
      if: ${{ inputs.cache == 'true' && inputs.cache-mode == 'split' && inputs.save != 'true' }}
      id: build-cache-restore-only
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ steps.resolve-paths.outputs.cache-dir }}/core
          ${{ steps.resolve-paths.outputs.cache-dir }}/framework-libs
          ${{ steps.resolve-paths.outputs.cache-dir }}/library-selection
          ${{ steps.resolve-paths.outputs.zccache-store-path }}
        key: fbuild-build-${{ inputs.cache-version }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.fbuild-hash.outputs.fbuild-hash }}-${{ steps.split-plan.outputs.board }}-${{ inputs.cache-key-extra }}
        restore-keys: |
          fbuild-build-${{ inputs.cache-version }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.fbuild-hash.outputs.fbuild-hash }}-${{ steps.split-plan.outputs.board }}-
