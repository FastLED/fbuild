name: Build LPC845

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/lpc845/**'
      - 'crates/fbuild-build-arm/src/nxplpc/**'
      - 'crates/fbuild-build-arm/src/generic_arm/**'
      - '.github/workflows/build-lpc845.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/lpc845/**'
      - 'crates/fbuild-build-arm/src/nxplpc/**'
      - 'crates/fbuild-build-arm/src/generic_arm/**'
      - '.github/workflows/build-lpc845.yml'

concurrency:
  group: build-lpc845.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "NXP LPC845-BRK"
      test-dir: "tests/platform/lpc845"
      env-name: "lpc845"
      firmware-ext: "bin"
