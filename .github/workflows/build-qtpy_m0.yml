name: Build QT Py M0

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/qtpy_m0/**'
      - 'crates/fbuild-build-arm/src/sam/**'
      - '.github/workflows/build-qtpy_m0.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/qtpy_m0/**'
      - 'crates/fbuild-build-arm/src/sam/**'
      - '.github/workflows/build-qtpy_m0.yml'

concurrency:
  group: build-qtpy_m0.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "QT Py M0"
      test-dir: "tests/platform/qtpy_m0"
      env-name: "qtpy_m0"
      firmware-ext: "bin"
