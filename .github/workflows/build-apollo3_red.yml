name: Build Apollo3 RedBoard

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: build-apollo3_red.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "Apollo3 RedBoard"
      test-dir: "tests/platform/apollo3_red"
      env-name: "apollo3_red"
      firmware-ext: "bin"
