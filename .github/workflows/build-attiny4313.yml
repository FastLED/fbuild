name: Build ATtiny4313

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/attiny4313/**'
      - 'crates/fbuild-build-mcu/src/avr/**'
      - '.github/workflows/build-attiny4313.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/attiny4313/**'
      - 'crates/fbuild-build-mcu/src/avr/**'
      - '.github/workflows/build-attiny4313.yml'

concurrency:
  group: build-attiny4313.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "ATtiny4313"
      test-dir: "tests/platform/attiny4313"
      env-name: "attiny4313"
      firmware-ext: "hex"
