name: Build Arduino Due

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/sam3x8e_due/**'
      - 'crates/fbuild-build-arm/src/sam/**'
      - '.github/workflows/build-sam3x8e_due.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/sam3x8e_due/**'
      - 'crates/fbuild-build-arm/src/sam/**'
      - '.github/workflows/build-sam3x8e_due.yml'

concurrency:
  group: build-sam3x8e_due.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "Arduino Due"
      test-dir: "tests/platform/sam3x8e_due"
      env-name: "sam3x8e_due"
      firmware-ext: "bin"
