name: Check Ubuntu

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

# Auto-cancel superseded PR runs: pushing again to a feature branch
# supersedes the in-flight run instead of queueing behind it. Non-PR
# events key on run_id so each gets its own group -- a shared group keeps
# only ONE pending run, which would silently drop queued main SHAs.
concurrency:
  group: check-ubuntu.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: Check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Verify candidate SHA
        if: inputs.ref != ''
        env:
          CANDIDATE_SHA: ${{ inputs.ref }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      # Workspace tests also link the embedded-Python test target, even
      # when its tests are ignored. Use the same managed interpreter on
      # hosted runners and locally instead of relying on host dev packages.
      - name: Select workspace test interpreter
        run: |
          uv python install 3.12
          PYO3_PYTHON="$(uv python find --managed-python 3.12)"
          echo "PYO3_PYTHON=$PYO3_PYTHON" >> "$GITHUB_ENV"
          PYTHONHOME="$("$PYO3_PYTHON" -c 'import sys; print(sys.prefix)')"
          echo "PYTHONHOME=$PYTHONHOME" >> "$GITHUB_ENV"
      - name: Setup soldr
        id: setup-soldr
        uses: zackees/setup-soldr@5d6965527b1bcee437d8aefb28cb38f3acfabd5c # setup-soldr#582 exact-main promotion canary
        with:
          # Own build-cache store (setup-soldr#237): with no suffix this job
          # shared one Cargo.lock-keyed entry with ~10 other workflows, and
          # the first small job to save it (165 MB) froze it -- an exact hit
          # never re-saves -- so every run recompiled ~240 crates. Distinct
          # from python-facade-tests below, whose 166MB cache otherwise won
          # the shared entry over this job's 479MB save.
          # The old generation was seeded by a failed local workspace job
          # before job-status was wired. An exact hit never re-saves it.
          # Start a generation for the explicitly managed Python 3.12 ABI.
          cache-key-suffix: check-ubuntu-py312-v1
          job-status: ${{ job.status }}
          save-on-failure: ${{ job.status == 'failure' && steps.tests.outputs.assertion_failure_only == 'true' }}
          cache: true
          build-cache: true
          target-cache: true
          prebuild-deps: none
          # Opt out of the implicit `SOLDR_LINKER=fast` injection so cargo /
          # rust-toolchain.toml stays in charge. Silences the routine
          # "defaulting SOLDR_LINKER=fast" warning (issue #400 /
          # setup-soldr#377).
          linker: platform-default
          # Realistic zccache payload for the workspace check job is
          # ~1.5–2 GiB (issue #400). Raise the soft warn threshold above
          # the steady-state size so the action only flags genuinely
          # runaway caches. Hard cap stays at the action default (6 GiB).
          cache-payload-warn-bytes: 2GiB

      # No separate `cargo check`: clippy type-checks the same
      # `--workspace --all-targets` set, so a prior check only re-did that work.
      # Measured locally (fresh target dir, warm zccache): check+clippy 194s
      # vs clippy alone 106s.
      - name: Clippy
        run: soldr cargo clippy --workspace --all-targets -- -D warnings
      # Both guards are stdlib-only. `--no-project` skips building the fbuild
      # package, whose soldr build backend is pinned older than the broker
      # setup-soldr started, and the mismatched daemon refused every compile.
      - name: Check tracked Python complexity ratchet
        run: uv run --no-project python ci/check_python_complexity.py
      - name: Lint subprocess spawns
        run: uv run --no-project python ci/find_direct_subprocess.py --fail
      - name: Guard production USB VID/PID catalogue literals
        run: uv run --no-project python ci/check_usb_vidpid_literals.py
      - name: Test
        id: tests
        run: uv run --no-project python ci/test_cache_status.py -- soldr cargo test --workspace
      - name: Test optional SDK library linkage with native GCC LTO
        run: |
          soldr cargo test -p fbuild-build-engine --lib optional_framework_archive_preserves_only_referenced_initializers -- --ignored
          soldr cargo test -p fbuild-build-arm --lib optional_library_rescans_earlier_dependency_archive -- --ignored
      - name: Test GNU linker overflow summaries
        run: soldr cargo test -p fbuild-build --test it link_overflow::failed_link_reports_each_actual_region_capacity -- --ignored --nocapture
      - name: Test large library archive
        run: soldr cargo test -p fbuild-library large_archive_handles_windows_command_limit_and_quoted_paths -- --ignored --nocapture

  glibc-floor:
    # FastLED/fbuild#1629. The manylinux_2_17 tag is assigned from a filename
    # map in ci/publish.py, not measured, and `cargo check` never links -- so a
    # too-new glibc symbol (libc::memfd_create, glibc 2.27+, was the real case)
    # survives every PR gate and only fails in the release cross-link lane.
    # Cross-link the two shipped binaries for both Linux arches under soldr's
    # glibc-2.17 sysroot, then read the linked symbol tables. No new workflow
    # file: this is another job in the existing Ubuntu lane.
    name: glibc 2.17 floor (linux x86_64 + aarch64)
    runs-on: ubuntu-latest
    # Cold cache: two release cross-links of fbuild-cli + fbuild-daemon.
    # Measured ~16 min for the daemon alone on a loaded 16-core host with an
    # empty cache; 60 leaves room for the first (cache-miss) run.
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Verify candidate SHA
        if: inputs.ref != ''
        env:
          CANDIDATE_SHA: ${{ inputs.ref }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      # Own build-cache store: this job cross-links two release targets and
      # must not compete with (or poison) the test job's cache generation.
      - name: Setup soldr
        uses: zackees/setup-soldr@5d6965527b1bcee437d8aefb28cb38f3acfabd5c # setup-soldr#582 exact-main promotion canary
        with:
          cache-key-suffix: glibc-floor
          job-status: ${{ job.status }}
          cache: true
          build-cache: true
          target-cache: true
          prebuild-deps: none
          linker: platform-default
      - name: Self-test the floor guard
        run: uv run --no-project python -m unittest ci.test_check_glibc_floor
      - name: Cross-link release binaries
        timeout-minutes: 45
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            soldr prepare --target "$target"
            soldr build --release --target "$target" -p fbuild-cli -p fbuild-daemon
          done
      - name: Enforce the manylinux_2_17 floor
        run: |
          uv run --no-project python ci/check_glibc_floor.py --floor 2.17 \
            target/x86_64-unknown-linux-gnu/release/fbuild \
            target/x86_64-unknown-linux-gnu/release/fbuild-daemon \
            target/aarch64-unknown-linux-gnu/release/fbuild \
            target/aarch64-unknown-linux-gnu/release/fbuild-daemon

  python-facade-tests:
    # FastLED/fbuild#1485 §5.2/§6: the embedded-CPython AT-P integration
    # tests need libpython at link and run time, so they're `#[ignore]`d
    # out of the default `soldr cargo test --workspace` sweep above and run
    # here instead, under a pinned interpreter, with `--ignored`.
    # No LD_LIBRARY_PATH export: crates/fbuild-python/build.rs bakes the
    # PYO3_PYTHON libdir into the test binaries' RUNPATH (#1487).
    name: Python facade tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Verify candidate SHA
        if: inputs.ref != ''
        env:
          CANDIDATE_SHA: ${{ inputs.ref }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.10"
      - name: Setup soldr
        uses: zackees/setup-soldr@5d6965527b1bcee437d8aefb28cb38f3acfabd5c # setup-soldr#582 exact-main promotion canary
        with:
          cache-key-suffix: python-facades
          job-status: ${{ job.status }}
          save-on-failure: ${{ job.status == 'failure' && steps.tests.outputs.assertion_failure_only == 'true' }}
          cache: true
          build-cache: true
          target-cache: true
          prebuild-deps: none
          linker: platform-default
      - name: Run embedded-CPython facade tests
        run: |
          uv python install 3.10
          PYO3_PYTHON="$(uv python find 3.10)"
          echo "PYO3_PYTHON=$PYO3_PYTHON" >> "$GITHUB_ENV"
          PYTHONHOME="$("$PYO3_PYTHON" -c 'import sys; print(sys.prefix)')"
          echo "PYTHONHOME=$PYTHONHOME" >> "$GITHUB_ENV"
      - name: Test (python facades, --ignored)
        id: tests
        run: uv run --no-project python ci/test_cache_status.py -- soldr cargo test -p fbuild-python --test python_facades -- --ignored
