name: Check Ubuntu

on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      glibc_floor:
        description: Run the release glibc cross-link check
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      # Plain identifier, not `glibc-floor`: ci-lint's replay static exclusion
      # resolves `inputs.<name>` for plain identifiers only, so a hyphenated
      # name would keep this job in every replay graph (GATE-001).
      glibc_floor:
        # The release cross-link below. ci-minimal turns it off on the PR and
        # merge-queue path and on for push to main.
        type: boolean
        required: false
        default: true

# Auto-cancel superseded PR runs: pushing again to a feature branch
# supersedes the in-flight run instead of queueing behind it. Non-PR
# events key on run_id so each gets its own group -- a shared group keeps
# only ONE pending run, which would silently drop queued main SHAs.
concurrency:
  group: check-ubuntu.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Runner selection for the Check job. pool-select (forge-ci/ci.yml
  # actions/pool-select) reads the forge pool's tokenless status endpoint and
  # answers with the repository variable FORGE_POOL_LABELS (the self-hosted
  # Dell pool, Ubuntu 24.04 image) when the pool has an idle matching runner
  # and the event is trusted: push, merge_group, workflow_dispatch, or a pull
  # request from this repository. Fork pull requests, an unset variable, or
  # any error give ubuntu-latest. The selector itself runs on forge-quick
  # (vars.FORGE_QUICK_LABELS), never for a fork pull request. Unset either
  # variable to fall back to hosted.
  pool:
    name: Select runner
    if: >-
      vars.FORGE_POOL_LABELS != ''
      && (github.event_name == 'push'
          || github.event_name == 'merge_group'
          || github.event_name == 'workflow_dispatch'
          || (github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ${{ vars.FORGE_QUICK_LABELS != '' && fromJSON(vars.FORGE_QUICK_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 2
    permissions: {}
    outputs:
      runs-on: ${{ steps.select.outputs.runs-on || '"ubuntu-latest"' }}
    steps:
      - name: Select pool or hosted
        id: select
        continue-on-error: true
        uses: forge-ci/ci.yml/actions/pool-select@a36bc81ad6ada5fb17398e3e7ba38435cc67a951
        with:
          labels: ${{ vars.FORGE_POOL_LABELS }}
          fallback: ubuntu-latest

  check:
    name: Check (ubuntu-latest)
    needs: pool
    # A skipped or failed selector means hosted. Read its output only after
    # it succeeded: act hands a skipped job's outputs on unevaluated.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.pool.result == 'success' && fromJSON(needs.pool.outputs.runs-on || '"ubuntu-latest"') || 'ubuntu-latest' }}
    # 45 min, not 30: the suite now runs 27-31 min wall on the Dell pool
    # (2026-11-22 merge-group runs 45023302280 wall=1823s and 45028183293
    # wall=1862s were killed at the old 30-min cap mid-test, which reads as
    # `cancelled` -> `CI summary` red -> the merge queue ejects the PR; the
    # one green run of the day was wall=1650s, only 2.5 min of headroom).
    # A queue ref never restores a warm build cache (`save-cache` skips a
    # non-default ref), so every merge group compiles from cold; 45 still
    # bounds a wedged job.
    timeout-minutes: 45
    env:
      SOLDR_S3_CACHE_ACCESS_KEY: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
      SOLDR_S3_CACHE_SECRET_KEY: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}
      # FastLED/fbuild#2178: the Dell pool's shared soldr daemon can drop a
      # compile mid-build (exit 101 from a build.rs step, no rustc diagnostic).
      # The wrapper retries that once when the daemon is the only culprit and
      # the spent wall clock still fits the budget below.
      # 600s of the job's timeout leaves room for one second attempt.
      FBUILD_CI_DAEMON_DEATH_RETRY: "1"
      FBUILD_CI_DAEMON_RETRY_BUDGET_SECONDS: "600"
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Verify candidate SHA
        if: inputs.ref != ''
        env:
          CANDIDATE_SHA: ${{ inputs.ref }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      # Workspace tests also link the embedded-Python test target, even
      # when its tests are ignored. Use the same managed interpreter on
      # hosted runners and locally instead of relying on host dev packages.
      - name: Select workspace test interpreter
        run: |
          uv python install 3.12
          PYO3_PYTHON="$(uv python find --managed-python 3.12)"
          echo "PYO3_PYTHON=$PYO3_PYTHON" >> "$GITHUB_ENV"
          PYTHONHOME="$("$PYO3_PYTHON" -c 'import sys; print(sys.prefix)')"
          echo "PYTHONHOME=$PYTHONHOME" >> "$GITHUB_ENV"
      - name: Setup soldr
        id: setup-soldr
        uses: zackees/setup-soldr@v0
        with:
          s3-bucket: forge-ci-cache
          s3-endpoint: sfo3.digitaloceanspaces.com
          # Own build-cache store (setup-soldr#237): with no suffix this job
          # shared one Cargo.lock-keyed entry with ~10 other workflows, and
          # the first small job to save it (165 MB) froze it -- an exact hit
          # never re-saves -- so every run recompiled ~240 crates. Distinct
          # from python-facade-tests below, whose 166MB cache otherwise won
          # the shared entry over this job's 479MB save.
          # The old generation was seeded by a failed local workspace job
          # before job-status was wired. An exact hit never re-saves it.
          # Start a generation for the explicitly managed Python 3.12 ABI.
          cache-key-suffix: check-ubuntu-py312-v1
          job-status: ${{ job.status }}
          save-on-failure: ${{ job.status == 'failure' && steps.tests.outputs.assertion_failure_only == 'true' }}
          cache: true
          build-cache: true
          target-cache: true
          prebuild-deps: none
          # Opt out of the implicit `SOLDR_LINKER=fast` injection so cargo /
          # rust-toolchain.toml stays in charge. Silences the routine
          # "defaulting SOLDR_LINKER=fast" warning (issue #400 /
          # setup-soldr#377).
          linker: platform-default
          # Realistic zccache payload for the workspace check job is
          # ~1.5–2 GiB (issue #400). Raise the soft warn threshold above
          # the steady-state size so the action only flags genuinely
          # runaway caches. Hard cap stays at the action default (6 GiB).
          cache-payload-warn-bytes: 2GiB

      # Host Clippy runs in dylint.yml's `dylint` job, not here: this job is
      # replayed through bosn by the local gate, and lint never runs under
      # bosn (GATE-016). The local `dylint` lane covers Clippy with `soldr lint`.
      # Both guards are stdlib-only. `--no-project` skips building the fbuild
      # package, whose soldr build backend is pinned older than the broker
      # setup-soldr started, and the mismatched daemon refused every compile.
      - name: Check tracked Python complexity ratchet
        run: uv run --no-project python ci/check_python_complexity.py
      # Every tracked .py must pass basedpyright ([tool.basedpyright] in
      # pyproject.toml). The checker supplies its own uv environment.
      - name: Check tracked Python types
        run: uv run --no-project python ci/check_python_types.py
      - name: Test cold-build disk provisioning
        run: uv run --no-project python -m unittest ci.test_reclaim_android_ndks
      - name: Lint subprocess spawns
        run: uv run --no-project python ci/find_direct_subprocess.py --fail
      - name: Guard production USB VID/PID catalogue literals
        run: uv run --no-project python ci/check_usb_vidpid_literals.py
      - name: Test
        id: tests
        run: |
          # APE tests need owner-controlled temp directories. Bosn's runner
          # starts with umask 0000, while hosted Ubuntu defaults to 0022.
          umask 022
          uv run --no-project python ci/test_cache_status.py -- soldr cargo test --workspace
      # Every `soldr cargo test` in this job goes through
      # ci/test_cache_status.py: the targeted `--ignored` steps below compile too,
      # and both #2197 merge-queue deaths landed inside one of them while
      # FBUILD_CI_DAEMON_DEATH_RETRY=1 sat armed and unused (#2178).
      - name: Test optional SDK library linkage with native GCC LTO
        run: |
          uv run --no-project python ci/test_cache_status.py -- soldr cargo test -p fbuild-build-engine --lib optional_framework_archive_preserves_only_referenced_initializers -- --ignored
          uv run --no-project python ci/test_cache_status.py -- soldr cargo test -p fbuild-build-arm --lib optional_library_rescans_earlier_dependency_archive -- --ignored
      - name: Test library assembly and archive policies with native GCC
        run: |
          uv run --no-project python ci/test_cache_status.py -- soldr cargo test -p fbuild-library --lib library_assembly -- --include-ignored
          uv run --no-project python ci/test_cache_status.py -- soldr cargo test -p fbuild-library --lib archive_policy_tests -- --include-ignored
          uv run --no-project python ci/test_cache_status.py -- soldr cargo test -p fbuild-build-engine --lib disabling_library_archives_preserves_core_isr_extraction -- --ignored
          uv run --no-project python ci/test_cache_status.py -- soldr cargo test -p fbuild-build-engine --lib incremental_policy_toggles_relink_same_elf_through_production_fast_path -- --ignored
      - name: Test GNU linker overflow summaries
        run: uv run --no-project python ci/test_cache_status.py -- soldr cargo test -p fbuild-build --test it link_overflow::failed_link_reports_each_actual_region_capacity -- --ignored --nocapture
      - name: Test large library archive
        run: uv run --no-project python ci/test_cache_status.py -- soldr cargo test -p fbuild-library large_archive_handles_windows_command_limit_and_quoted_paths -- --ignored --nocapture

  glibc-floor:
    # FastLED/fbuild#1629. The manylinux_2_17 tag is assigned from a filename
    # map in ci/publish.py, not measured, and `cargo check` never links -- so a
    # too-new glibc symbol (libc::memfd_create, glibc 2.27+, was the real case)
    # survives every PR gate and only fails in the release cross-link lane.
    # Cross-link the two shipped binaries for both Linux arches under soldr's
    # glibc-2.17 sysroot, then read the linked symbol tables. No new workflow
    # file: this is another job in the existing Ubuntu lane.
    name: glibc 2.17 floor (linux x86_64 + aarch64)
    if: ${{ inputs.glibc_floor }}
    runs-on: ubuntu-latest
    # Cold cache: two release cross-links of fbuild-cli + fbuild-daemon.
    # Measured ~16 min for the daemon alone on a loaded 16-core host with an
    # empty cache; 60 leaves room for the first (cache-miss) run.
    timeout-minutes: 60
    env:
      SOLDR_S3_CACHE_ACCESS_KEY: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
      SOLDR_S3_CACHE_SECRET_KEY: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Verify candidate SHA
        if: inputs.ref != ''
        env:
          CANDIDATE_SHA: ${{ inputs.ref }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      # Own build-cache store: this job cross-links two release targets and
      # must not compete with (or poison) the test job's cache generation.
      - name: Provision cold-build disk capacity
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: uv run --no-project python ci/reclaim_android_ndks.py
      - name: Setup soldr
        uses: zackees/setup-soldr@v0
        with:
          s3-bucket: forge-ci-cache
          s3-endpoint: sfo3.digitaloceanspaces.com
          cache-key-suffix: glibc-floor
          job-status: ${{ job.status }}
          cache: true
          build-cache: true
          target-cache: true
          prebuild-deps: none
          linker: platform-default
      - name: Self-test the floor guard
        run: uv run --no-project python -m unittest ci.test_check_glibc_floor
      - name: Cross-link release binaries
        timeout-minutes: 45
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            soldr prepare --target "$target"
            soldr build --release --target "$target" -p fbuild-cli -p fbuild-daemon
          done
      - name: Enforce the manylinux_2_17 floor
        run: |
          uv run --no-project python ci/check_glibc_floor.py --floor 2.17 \
            target/x86_64-unknown-linux-gnu/release/fbuild \
            target/x86_64-unknown-linux-gnu/release/fbuild-daemon \
            target/aarch64-unknown-linux-gnu/release/fbuild \
            target/aarch64-unknown-linux-gnu/release/fbuild-daemon

  python-facade-tests:
    # FastLED/fbuild#1485 §5.2/§6: the embedded-CPython AT-P integration
    # tests need libpython at link and run time, so they're `#[ignore]`d
    # out of the default `soldr cargo test --workspace` sweep above and run
    # here instead, under a pinned interpreter, with `--ignored`.
    # No LD_LIBRARY_PATH export: crates/fbuild-python/build.rs bakes the
    # PYO3_PYTHON libdir into the test binaries' RUNPATH (#1487).
    name: Python facade tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLDR_S3_CACHE_ACCESS_KEY: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
      SOLDR_S3_CACHE_SECRET_KEY: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}
      # FastLED/fbuild#2178: the Dell pool's shared soldr daemon can drop a
      # compile mid-build (exit 101 from a build.rs step, no rustc diagnostic).
      # The wrapper retries that once when the daemon is the only culprit and
      # the spent wall clock still fits the budget below.
      # 300s of the job's timeout leaves room for one second attempt.
      FBUILD_CI_DAEMON_DEATH_RETRY: "1"
      FBUILD_CI_DAEMON_RETRY_BUDGET_SECONDS: "300"
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Verify candidate SHA
        if: inputs.ref != ''
        env:
          CANDIDATE_SHA: ${{ inputs.ref }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.10"
      - name: Setup soldr
        uses: zackees/setup-soldr@v0
        with:
          s3-bucket: forge-ci-cache
          s3-endpoint: sfo3.digitaloceanspaces.com
          cache-key-suffix: python-facades
          job-status: ${{ job.status }}
          save-on-failure: ${{ job.status == 'failure' && steps.tests.outputs.assertion_failure_only == 'true' }}
          cache: true
          build-cache: true
          target-cache: true
          prebuild-deps: none
          linker: platform-default
      - name: Run embedded-CPython facade tests
        run: |
          uv python install 3.10
          PYO3_PYTHON="$(uv python find 3.10)"
          echo "PYO3_PYTHON=$PYO3_PYTHON" >> "$GITHUB_ENV"
          PYTHONHOME="$("$PYO3_PYTHON" -c 'import sys; print(sys.prefix)')"
          echo "PYTHONHOME=$PYTHONHOME" >> "$GITHUB_ENV"
      - name: Test (python facades, --ignored)
        id: tests
        run: uv run --no-project python ci/test_cache_status.py -- soldr cargo test -p fbuild-python --test python_facades -- --ignored
