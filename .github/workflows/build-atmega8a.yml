name: Build ATmega8A

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/atmega8a/**'
      - 'crates/fbuild-build-mcu/src/avr/**'
      - '.github/workflows/build-atmega8a.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/atmega8a/**'
      - 'crates/fbuild-build-mcu/src/avr/**'
      - '.github/workflows/build-atmega8a.yml'

concurrency:
  group: build-atmega8a.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "ATmega8A"
      test-dir: "tests/platform/atmega8a"
      env-name: "atmega8a"
      firmware-ext: "hex"
