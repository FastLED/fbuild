name: Build SuperMini nRF52840

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: build-supermini_nrf52840.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "SuperMini nRF52840"
      test-dir: "tests/platform/supermini_nrf52840"
      env-name: "supermini_nrf52840"
      firmware-ext: "hex"
