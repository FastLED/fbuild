name: Build Comparison Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bench/blink/**'
      - 'bench/fastled-examples/src/build_comparison*.rs'
      - 'bench/fastled-examples/Cargo.toml'
      - '.github/workflows/benchmark-build-comparison.yml'
      # Server-side download fallback settings ride the same Pages site
      # (FastLED/fbuild#1810).
      - 'site/mirror/**'
  schedule:
    # Off-hour UTC slot avoids the hosted-runner top-of-hour surge.
    - cron: '17 9 * * *'

concurrency:
  group: benchmark-build-comparison-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'
  # Match the rest of the fleet: the benchmark job installs two toolchains
  # after building fbuild, so the default 5 GiB free-space floor aborts the
  # build with "build volume has only N GiB free" on a fresh runner.
  SOLDR_TARGET_BLOCK_FREE_GB: '2'
  PLATFORMIO_CORE_VERSION: '6.2.0'
  ARDUINO_CLI_VERSION: '1.5.0'
  # Resolve against the registry index committed at this sha, not the copy
  # this very workflow is about to publish (FastLED/fbuild#1829).
  FBUILD_MIRROR_MANIFEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/site/mirror/manifest.json

jobs:
  benchmark:
    name: Measure and publish Blink builds
    runs-on: ubuntu-24.04
    # Cold trials install from nothing at 10 Mbit: ~1 GB for PlatformIO and
    # ~1.8 GB for Arduino CLI on ESP32-S3, three times each.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v3

      - name: Setup soldr
        uses: zackees/setup-soldr@v0
        with:
          cache-key-suffix: benchmark-build-comparison-benchmark
          cache: true
          build-cache: true
          target-cache: true
          prebuild-deps: none
          linker: platform-default
          cache-payload-warn-bytes: 2GiB

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Install benchmark toolchains
        shell: bash
        run: |
          set -euo pipefail
          uv tool install --with pip "platformio==${PLATFORMIO_CORE_VERSION}"
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          # Only the index is primed. Packages install inside the timed builds.
          arduino-cli core update-index

      - name: Build fbuild and benchmark runner
        shell: bash
        run: |
          set -euo pipefail
          soldr cargo build --release \
            -p fbuild-cli --bin fbuild \
            -p fbuild-daemon --bin fbuild-daemon \
            -p fbuild-bench-fastled-examples --bin bench-build-comparison

      - name: Restore rolling history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-stats
          if git ls-remote --exit-code origin refs/heads/benchmark-stats >/dev/null; then
            git fetch --depth=1 origin refs/heads/benchmark-stats
            git show FETCH_HEAD:history.jsonl > benchmark-stats/history.jsonl
          else
            status=$?
            if [[ "${status}" -eq 2 ]]; then
              : > benchmark-stats/history.jsonl
            else
              exit "${status}"
            fi
          fi

      - name: Create the 10 Mbit/s benchmark network namespace
        shell: bash
        run: |
          set -euo pipefail
          # Do NOT shape the runner's own interface. Throttling all ingress
          # starves the runner's control channel to GitHub and the job dies with
          # "the hosted runner lost communication with the server" (run
          # 41969830529). Instead put the benchmark in its own netns behind a
          # veth pair and shape only that veth, so every process in the
          # benchmark tree is limited and the runner keeps full connectivity.
          iface="$(ip route | awk '/^default/{print $5; exit}')"
          if [[ -z "${iface}" ]]; then
            echo "::error::no default-route interface found"
            exit 1
          fi
          sudo -S -p '' ip netns add bench
          sudo -S -p '' ip link add veth-h type veth peer name veth-b
          sudo -S -p '' ip link set veth-b netns bench
          sudo -S -p '' ip addr add 10.200.0.1/24 dev veth-h
          sudo -S -p '' ip link set veth-h up
          sudo -S -p '' ip netns exec bench ip link set lo up
          sudo -S -p '' ip netns exec bench ip addr add 10.200.0.2/24 dev veth-b
          sudo -S -p '' ip netns exec bench ip link set veth-b up
          sudo -S -p '' ip netns exec bench ip route add default via 10.200.0.1
          sudo -S -p '' sysctl -qw net.ipv4.ip_forward=1
          sudo -S -p '' iptables -t nat -A POSTROUTING -s 10.200.0.0/24 -o "${iface}" -j MASQUERADE
          sudo -S -p '' iptables -A FORWARD -i veth-h -o "${iface}" -j ACCEPT
          sudo -S -p '' iptables -A FORWARD -i "${iface}" -o veth-h -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          sudo -S -p '' mkdir -p /etc/netns/bench
          echo 'nameserver 1.1.1.1' | sudo -S -p '' tee /etc/netns/bench/resolv.conf >/dev/null
          # Host->namespace traffic is what downloads traverse; shape it.
          sudo -S -p '' tc qdisc replace dev veth-h root tbf rate 10mbit burst 64kb latency 400ms
          echo "bench netns up; veth-h shaped to 10 Mbit/s (egress into bench)"

          read -r speed size elapsed <<<"$(sudo ip netns exec bench curl -sS -o /dev/null --max-time 240             -w '%{speed_download} %{size_download} %{time_total}'             'https://speed.cloudflare.com/__down?bytes=10000000')"
          echo "namespace download probe: ${size} bytes at ${speed} B/s in ${elapsed}s"
          # Reject an unshaped link (>1.8 MB/s) and an over-throttled one
          # (<0.9 MB/s), so "10 Mbit" means ~10 Mbit rather than "some number".
          if ! awk -v s="${speed}" -v n="${size}" 'BEGIN { exit !(n >= 9000000 && s <= 1800000 && s >= 900000) }'; then
            echo "::error::namespace probe got ${speed} B/s for ${size} bytes; not ~10 Mbit/s (0.9-1.8 MB/s)"
            exit 1
          fi

      - name: Run cold/warm comparison and render site
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner parallelism: nproc=$(nproc)"
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sudo ip netns exec bench runuser -u "$(id -un)" -- \
            env HOME="${HOME}" PATH="${PATH}" \
          target/release/bench-build-comparison \
            --project-dir bench/blink \
            --fbuild target/release/fbuild \
            --output-dir benchmark-stats \
            --trials 3 \
            --network-mbit 10 \
            --repository "${GITHUB_REPOSITORY}" \
            --git-sha "${GITHUB_SHA}" \
            --generated-at "${generated_at}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --pages-url https://fastled.github.io/fbuild/ \
            --raw-base-url https://raw.githubusercontent.com/FastLED/fbuild/benchmark-stats

      - name: Remove the benchmark network namespace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo -S -p '' ip netns del bench 2>/dev/null || true
          sudo -S -p '' ip link del veth-h 2>/dev/null || true
          iface="$(ip route | awk '/^default/{print $5; exit}')"
          if [[ -n "${iface}" ]]; then
            sudo -S -p '' iptables -t nat -D POSTROUTING -s 10.200.0.0/24 -o "${iface}" -j MASQUERADE 2>/dev/null || true
            sudo -S -p '' iptables -D FORWARD -i veth-h -o "${iface}" -j ACCEPT 2>/dev/null || true
            sudo -S -p '' iptables -D FORWARD -i "${iface}" -o veth-h -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || true
          fi

      - name: Summarize cold-build breakdown
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          latest=benchmark-stats/latest.json
          if [[ ! -f "${latest}" ]]; then
            echo "No ${latest}; skipping summary." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          {
            echo "## Cold-build breakdown"
            echo
            echo "- nproc: $(nproc)"
            jq -r '"- raw_baseline_ms: \(.raw_baseline_ms // "n/a")",
                   "- fbuild_overhead_ms: \(.fbuild_overhead_ms // "n/a")",
                   "- fbuild_vs_platformio_cold: \(.fbuild_vs_platformio_cold // "n/a")"' "${latest}"
            echo
            echo "| board | tool | phase | cold ms |"
            echo "|---|---|---|---:|"
            jq -r '.results[]? | select(.tool == "fbuild" or .tool == "platformio")
                   | . as $r | (.cold_phases_ms // {}) | to_entries[]?
                   | "| \($r.board) | \($r.tool) | \(.key) | \(.value // "n/a") |"' "${latest}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload benchmark site snapshot
        uses: actions/upload-artifact@v7
        with:
          name: build-comparison-site-${{ github.sha }}
          path: benchmark-stats
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload benchmark log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-comparison-log-${{ github.sha }}
          path: benchmark-output/benchmark.log
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Assemble and publish the Pages site
    # `site/mirror/**` is client-facing download metadata, so its deploy must not
    # hinge on the ESP32-S3 benchmark (FastLED/fbuild#1825). This job therefore
    # runs whenever the measurement job is DONE, not when it SUCCEEDED: it seeds
    # the site from the last published `benchmark-stats` branch and overlays fresh
    # measurements only if they exist. Pages deploys replace the whole site, so a
    # single assembler stays authoritative -- two publishers would clobber.
    needs: benchmark
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out the mirror manifest
        uses: actions/checkout@v6
        with:
          path: repo
          sparse-checkout: site/mirror
          sparse-checkout-cone-mode: false

      - name: Download benchmark site snapshot
        # Optional input: a broken or timed-out benchmark keeps the previous
        # report online instead of freezing the mirror.
        if: needs.benchmark.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: build-comparison-site-${{ github.sha }}
          path: benchmark-measurements

      - name: Assemble the site from the last publish plus fresh inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "${publish_dir}" init --quiet
          git -C "${publish_dir}" config user.name 'github-actions[bot]'
          git -C "${publish_dir}" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Pages deploys replace the whole site, so start from the last good
          # publish rather than from an empty tree (FastLED/fbuild#1825).
          if git ls-remote --exit-code "${repo_url}" refs/heads/benchmark-stats >/dev/null 2>&1; then
            git -C "${publish_dir}" fetch --depth=1 "${repo_url}" refs/heads/benchmark-stats
            git -C "${publish_dir}" reset --hard FETCH_HEAD
          fi
          git -C "${publish_dir}" checkout -B benchmark-stats
          if [[ -d benchmark-measurements ]]; then
            cp -a benchmark-measurements/. "${publish_dir}/"
          else
            echo "No benchmark measurements this run; keeping the last published report."
          fi
          # The Index points at per-owner shards (FastLED/fbuild#1815); ship them too.
          mkdir -p "${publish_dir}/mirror"
          cp -a repo/site/mirror/. "${publish_dir}/mirror/"
          git -C "${publish_dir}" add -A
          if git -C "${publish_dir}" diff --cached --quiet; then
            echo "No site changes to publish."
          else
            git -C "${publish_dir}" commit -m "chore: publish build benchmark for ${GITHUB_SHA}"
            git -C "${publish_dir}" push --force "${repo_url}" benchmark-stats
          fi
          echo "publish_dir=${publish_dir}" >> "${GITHUB_ENV}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.publish_dir }}

  deploy-pages:
    name: Deploy benchmark report
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
