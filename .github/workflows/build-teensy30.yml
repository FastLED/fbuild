name: Build Teensy 3.0

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/teensy30/**'
      - 'crates/fbuild-build-arm/src/teensy/**'
      - '.github/workflows/build-teensy30.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/teensy30/**'
      - 'crates/fbuild-build-arm/src/teensy/**'
      - '.github/workflows/build-teensy30.yml'

concurrency:
  group: build-teensy30.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "Teensy 3.0"
      test-dir: "tests/platform/teensy30"
      env-name: "teensy30"
      firmware-ext: "hex"
