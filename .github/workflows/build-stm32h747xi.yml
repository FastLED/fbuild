name: Build STM32H747XI

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/stm32h747xi/**'
      - 'crates/fbuild-build-arm/src/stm32/**'
      - '.github/workflows/build-stm32h747xi.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/stm32h747xi/**'
      - 'crates/fbuild-build-arm/src/stm32/**'
      - '.github/workflows/build-stm32h747xi.yml'

concurrency:
  group: build-stm32h747xi.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "STM32H747XI"
      test-dir: "tests/platform/stm32h747xi"
      env-name: "stm32h747xi"
      firmware-ext: "bin"
