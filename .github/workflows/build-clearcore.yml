name: Build Teknic ClearCore (SAME53)

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch:
    inputs:
      fbuild-run-id:
        description: 'Run holding a prebuilt fbuild artifact (empty: compile here)'
        type: string
        default: ''
      checkout_ref:
        description: 'Commit to build (empty: the dispatched ref)'
        type: string
        default: ''
  workflow_call: {}

concurrency:
  group: build-clearcore.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    secrets: inherit
    with:
      workflow-name: "Teknic ClearCore (SAME53)"
      test-dir: "tests/platform/clearcore"
      env-name: "clearcore"
      firmware-ext: "bin"
      checkout_ref: ${{ inputs.checkout_ref }}
      fbuild-artifact: ${{ inputs.fbuild-run-id && 'fbuild-bin-linux-debug' || '' }}
      fbuild-run-id: ${{ inputs.fbuild-run-id }}
      toolchain-cache: false
      # teknic.com is a single vendor host behind Sucuri with no CDN: the 2026-11-07
      # push run lost ClearCore-1.7.4 after the downloader's 5 attempts (~4 min) and
      # failed this gate before any compilation, and FastLED/fbuild#1463 lost the
      # same fetch on a release gate. Keep the 32 MB installed core between runs;
      # the key hashes the file that pins its URL and checksum, so a repin downloads
      # instead of restoring the old archive (the rule check-windows.yml's cache
      # already follows).
      package-cache-path: ~/.fbuild/prod/cache/platforms/www-ClearCore-1.7.4
      package-cache-hash-files: crates/fbuild-library/src/library/clearcore_core.rs
