name: ESP32-S3 arm64 slice proof (#1956)

# A per-host `@esp-toolchain` slice is AUTHORITATIVE once listed
# (`crates/fbuild-packages-fetch/src/variants.rs`): a listed slice that is
# missing one file fails the install instead of falling back to the whole
# archive. So a new host is only listed after a real ESP32-S3 build on a
# machine of that OS/arch -- exactly how linux-amd64 was accepted in
# #1949/#1953 and linux-arm64 in #1965.
#
# This workflow is the per-host proof harness (one leg per host): it builds the
# ESP32-S3 fixture twice from empty caches -- once resolving the slice named by
# the manifest of the dispatched ref, once downloading the vendor whole
# archive -- and requires identical firmware sizes plus a chip-scoped install.
#
# The Windows leg is `win64`, not the vendor metadata's `win32`: `fbuild`'s
# `detect_platform()` returns `win64` on every Windows host
# (`crates/fbuild-toolchain/src/toolchain/esp32_metadata.rs`), so a `win32`
# slice would be downloaded by nobody.
#
# The file name still says arm64 because `workflow_dispatch` resolves a workflow
# on the DEFAULT branch: renaming it would 404 every dispatch from a branch.
#
# The client is built FROM THIS REF rather than installed from PyPI: the
# registry-path slice fix (#1963) merged after the last release (2.5.51), and a
# wheel without it silently ignores `FBUILD_MIRROR_MANIFEST_URL` (#1961), so a
# wheel-based run would pass on a build that never touched the slice. Plain
# `cargo` is deliberate -- this ephemeral runner has no soldr broker and
# the harness must exercise the ref's own CLI+daemon pair (the CLI prefers the
# `fbuild-daemon` sitting next to it).
#
# Manual dispatch only: it downloads ~500 MB and compiles twice per leg.
on:
  workflow_dispatch:

concurrency:
  group: esp32s3-arm64-slice-proof.yml-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FIXTURE: tests/platform/esp32s3
  # Manifest of THIS ref: it lists the slice for the host under test, so the
  # client resolves the slice instead of the whole archive.
  # raw.githubusercontent.com serves any pushed ref, so the entry is exercised
  # before it reaches `main`.
  SLICE_MANIFEST_URL: https://raw.githubusercontent.com/FastLED/fbuild/${{ github.ref_name }}/site/mirror/manifest.json

jobs:
  arm64-slice:
    name: ${{ matrix.host }} slice == whole archive (esp32s3 Blink)
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        # Git Bash on Windows runners: one shell for every leg keeps the
        # harness (and its assertions) identical across hosts.
        shell: bash
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            host: linux-arm64
            machine: aarch64
            daemon: fbuild-daemon
          - runner: macos-15
            host: macos-arm64
            machine: arm64
            daemon: fbuild-daemon
          - runner: windows-latest
            host: win64
            machine: x86_64
            daemon: fbuild-daemon.exe
          # Intel macOS resolves `macos` (detect_platform(): non-aarch64 macOS),
          # never `macos-arm64`; `macos-15-intel` is the hosted x86_64 runner this
          # repo already uses in check-macos.yml / release-auto.yml.
          - runner: macos-15-intel
            host: macos
            machine: x86_64
            daemon: fbuild-daemon
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v3

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.host }}-slice-proof

      - name: Confirm this runner is the ${{ matrix.machine }} host the slice is for
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Build the client from this ref (CLI + daemon, dev profile)
        run: |
          set -euo pipefail
          cargo build -p fbuild-cli -p fbuild-daemon
          export PATH="$PWD/target/debug:$PATH"
          fbuild --version
          test -f "target/debug/${{ matrix.daemon }}"

      - name: Build with the published ${{ matrix.host }} slice
        run: |
          set -euo pipefail
          export PATH="$PWD/target/debug:$PATH"
          export FBUILD_DEV_MODE=1
          export FBUILD_CACHE_DIR="$RUNNER_TEMP/cache-slice"
          export FBUILD_BUILD_DIR="$RUNNER_TEMP/build-slice"
          export FBUILD_MIRROR_MANIFEST_URL="${SLICE_MANIFEST_URL}"
          fbuild daemon stop >/dev/null 2>&1 || true
          sleep 2
          fbuild build "${FIXTURE}" -e esp32s3 2>&1 | tee "$RUNNER_TEMP/slice.log"

      - name: Build with the vendor whole archive (control)
        run: |
          set -euo pipefail
          export PATH="$PWD/target/debug:$PATH"
          export FBUILD_DEV_MODE=1
          # Empty value disables the manifest override -> vendor whole archive.
          export FBUILD_CACHE_DIR="$RUNNER_TEMP/cache-whole"
          export FBUILD_BUILD_DIR="$RUNNER_TEMP/build-whole"
          export FBUILD_MIRROR_MANIFEST_URL=""
          fbuild daemon stop >/dev/null 2>&1 || true
          sleep 2
          fbuild build "${FIXTURE}" -e esp32s3 2>&1 | tee "$RUNNER_TEMP/whole.log"

      - name: Slice == whole archive, and the whole archive was never used
        run: |
          set -euo pipefail
          uv run --no-project python - <<'PY'
          import os, re, sys
          from pathlib import Path

          tmp = Path(os.environ["RUNNER_TEMP"])
          sizes = {}
          for name in ("slice", "whole"):
              log = (tmp / f"{name}.log").read_text(errors="replace")
              if "build succeeded" not in log:
                  sys.exit(f"{name} build did not succeed")
              flash = re.search(r"flash[:= ]+(\d+)", log)
              ram = re.search(r"ram[:= ]+(\d+)", log)
              if not (flash and ram):
                  sys.exit(f"{name} build printed no flash/ram sizes")
              sizes[name] = (int(flash.group(1)), int(ram.group(1)))
              print(f"{name}: flash {sizes[name][0]} / ram {sizes[name][1]}")

          if sizes["slice"] != sizes["whole"]:
              sys.exit(f"slice build differs from whole archive: {sizes}")

          cache = tmp / "cache-slice"
          if not any("+esp32s3" in p.name for p in cache.rglob("*") if p.is_dir()):
              sys.exit("no per-chip '+esp32s3' install directory: the slice path was not used")
          # The whole bundle is .tar.xz on unix and .zip on Windows, so key on
          # the vendor asset name instead of an extension (a platform zip from
          # the registry is a legitimate cache member).
          whole = [
              p
              for p in cache.rglob("*")
              if p.is_file()
              and p.name.startswith("xtensa-esp-elf")
              and p.suffix in (".xz", ".zip")
          ]
          if whole:
              sys.exit(f"the slice build downloaded a whole archive: {whole}")
          print("slice build used the per-chip install and downloaded no whole archive")
          PY
