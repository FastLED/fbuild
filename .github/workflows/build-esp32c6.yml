name: Build ESP32-C6

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/esp32c6/**'
      - 'crates/fbuild-build-esp/src/esp32/**'
      - '.github/workflows/build-esp32c6.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/esp32c6/**'
      - 'crates/fbuild-build-esp/src/esp32/**'
      - '.github/workflows/build-esp32c6.yml'

concurrency:
  group: build-esp32c6.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "ESP32-C6"
      test-dir: "tests/platform/esp32c6"
      env-name: "esp32c6"
      firmware-ext: "bin"
