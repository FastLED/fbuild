name: Build STM32F103CB

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: build-stm32f103cb.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "STM32F103CB"
      test-dir: "tests/platform/stm32f103cb"
      env-name: "stm32f103cb"
      firmware-ext: "hex"
