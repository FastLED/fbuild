name: Build STM32F103C8

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/stm32f103c8/**'
      - 'crates/fbuild-build-arm/src/stm32/**'
      - '.github/workflows/build-stm32f103c8.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/stm32f103c8/**'
      - 'crates/fbuild-build-arm/src/stm32/**'
      - '.github/workflows/build-stm32f103c8.yml'

concurrency:
  group: build-stm32f103c8.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "STM32F103C8"
      test-dir: "tests/platform/stm32f103c8"
      env-name: "stm32f103c8"
      firmware-ext: "hex"
