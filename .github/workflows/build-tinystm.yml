name: Build TinySTM103TB

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/hy_tinystm103tb/**'
      - 'crates/fbuild-build-arm/src/stm32/**'
      - '.github/workflows/build-tinystm.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/hy_tinystm103tb/**'
      - 'crates/fbuild-build-arm/src/stm32/**'
      - '.github/workflows/build-tinystm.yml'

concurrency:
  group: build-tinystm.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "TinySTM103TB"
      test-dir: "tests/platform/hy_tinystm103tb"
      env-name: "tinystm"
      firmware-ext: "hex"
