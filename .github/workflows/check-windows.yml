name: Check Windows

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

# Auto-cancel superseded PR runs: pushing again to a feature branch
# supersedes the in-flight run instead of queueing behind it. Non-PR
# events key on run_id so each gets its own group -- a shared group keeps
# only ONE pending run, which would silently drop queued main SHAs.
concurrency:
  group: check-windows.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: Check (windows-latest)
    runs-on: windows-latest
    # Cold Windows workspace tests exceeded the old 30-minute cap in the
    # setup-soldr 0.9.25 full-coverage canary.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Setup soldr
        id: setup-soldr
        uses: zackees/setup-soldr@67ed4018aca013f8388050ac9bc264244f9b742c
        with:
          cache-key-suffix: check-windows-check
          cache: true
          build-cache: true
          target-cache: true
          prebuild-deps: none
          # Opt out of the implicit `SOLDR_LINKER=fast` injection so cargo /
          # rust-toolchain.toml stays in charge. Silences the routine
          # "defaulting SOLDR_LINKER=fast" warning (issue #400 /
          # setup-soldr#377).
          linker: platform-default
          # Realistic zccache payload for the workspace check job is
          # ~1.5–2 GiB (issue #400). Raise the soft warn threshold above
          # the steady-state size so the action only flags genuinely
          # runaway caches. Hard cap stays at the action default (6 GiB).
          cache-payload-warn-bytes: 2GiB

      - name: Verify soldr
        shell: bash
        run: |
          version="$(soldr --version)"
          echo "$version"
          [[ "$version" == soldr\ * ]]
      # No separate `cargo check`: clippy type-checks the same
      # `--workspace --all-targets` set (see check-ubuntu.yml for the timing).
      - name: Clippy
        shell: bash
        run: soldr cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: soldr cargo test --workspace

      - name: Setup uv for legacy source package install
        uses: astral-sh/setup-uv@v3

      # Exercise the real uv-created Windows launcher, beyond the unit fixture.
      # Cold public install runs fbuild's internal esptool version verification.
      - name: Install and recheck legacy ESP32 source tools
        id: legacy-esptool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $probe = Join-Path $env:RUNNER_TEMP ("fbuild-legacy-esptool-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $probe | Out-Null
          $env:FBUILD_CACHE_DIR = Join-Path $probe "cache"
          [Environment]::SetEnvironmentVariable("FBUILD_ESPTOOL_PATH", $null, "Process")
          @"
          [env:esp32-idf4]
          platform = espressif32@4.4.0
          board = esp32dev
          framework = arduino
          "@ | Set-Content -LiteralPath (Join-Path $probe "platformio.ini") -Encoding utf8

          $coldJson = & soldr cargo run -p fbuild-cli --bin fbuild -- install "$probe" -e esp32-idf4 --json
          if ($LASTEXITCODE -ne 0) { throw "Cold legacy ESP32 install failed ($LASTEXITCODE)" }
          $coldJson | Write-Output
          $cold = ($coldJson -join "`n") | ConvertFrom-Json
          $coldTools = @($cold.environments.packages | Where-Object name -eq "tool-esptoolpy")
          if ($coldTools.Count -ne 1) { throw "Expected exactly one esptool package" }
          $coldTool = $coldTools[0]
          if ($coldTool.version -ne "1.30300.0" -or $coldTool.status -ne "fetched") {
            throw "Expected a cold install of esptool 3.3 source package 1.30300.0"
          }
          if (-not (Test-Path -LiteralPath $coldTool.install_path -PathType Leaf)) {
            throw "Installed esptool launcher is missing"
          }
          if ($coldTool.install_path -notmatch '[\\/]\.fbuild-tools[\\/]esptool[\\/]Scripts[\\/]esptool\.exe$') {
            throw "Expected the real uv-managed Windows esptool launcher"
          }

          $warmJson = & soldr cargo run -p fbuild-cli --bin fbuild -- install "$probe" -e esp32-idf4 --check --json
          if ($LASTEXITCODE -ne 0) { throw "Warm legacy ESP32 check failed ($LASTEXITCODE)" }
          $warmJson | Write-Output
          $warm = ($warmJson -join "`n") | ConvertFrom-Json
          $warmTools = @($warm.environments.packages | Where-Object name -eq "tool-esptoolpy")
          if ($warmTools.Count -ne 1) { throw "Expected exactly one cached esptool package" }
          $warmTool = $warmTools[0]
          if ($warmTool.version -ne "1.30300.0" -or $warmTool.status -ne "present" -or
              $warmTool.install_path -ne $coldTool.install_path) {
            throw "Warm check did not reuse the verified source launcher"
          }
          # The hosted runner discards RUNNER_TEMP after the job.

      # Pioarduino 55.03.35 pins esptool 5.1.0, whose release has no
      # Windows standalone binary. Verify the real source-package route.
      - name: Install and recheck ESP32-C6 source tools
        id: modern-esptool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $probe = Join-Path $env:RUNNER_TEMP ("fbuild-modern-esptool-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $probe | Out-Null
          $env:FBUILD_CACHE_DIR = Join-Path $probe "cache"
          [Environment]::SetEnvironmentVariable("FBUILD_ESPTOOL_PATH", $null, "Process")
          @"
          [env:esp32c6-idf5]
          platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
          board = esp32-c6-devkitc-1
          framework = arduino
          "@ | Set-Content -LiteralPath (Join-Path $probe "platformio.ini") -Encoding utf8

          $coldJson = & soldr cargo run -p fbuild-cli --bin fbuild -- install "$probe" -e esp32c6-idf5 --json
          if ($LASTEXITCODE -ne 0) { throw "Cold ESP32-C6 install failed ($LASTEXITCODE)" }
          $coldJson | Write-Output
          $cold = ($coldJson -join "`n") | ConvertFrom-Json
          $coldTools = @($cold.environments.packages | Where-Object name -eq "tool-esptoolpy")
          if ($coldTools.Count -ne 1) { throw "Expected exactly one esptool package" }
          $coldTool = $coldTools[0]
          if ($coldTool.version -ne "5.1.0" -or $coldTool.status -ne "fetched" -or
              $coldTool.url -ne "https://github.com/pioarduino/esptool/releases/download/v5.1.0/esptool.zip") {
            throw "Expected a cold install of the pinned esptool 5.1.0 source archive"
          }
          if (-not (Test-Path -LiteralPath $coldTool.install_path -PathType Leaf)) {
            throw "Installed esptool launcher is missing"
          }
          if ($coldTool.install_path -notmatch '[\\/]\.fbuild-tools[\\/]esptool[\\/]Scripts[\\/]esptool\.exe$') {
            throw "Expected the real uv-managed Windows esptool launcher"
          }

          $warmJson = & soldr cargo run -p fbuild-cli --bin fbuild -- install "$probe" -e esp32c6-idf5 --check --json
          if ($LASTEXITCODE -ne 0) { throw "Warm ESP32-C6 check failed ($LASTEXITCODE)" }
          $warmJson | Write-Output
          $warm = ($warmJson -join "`n") | ConvertFrom-Json
          $warmTools = @($warm.environments.packages | Where-Object name -eq "tool-esptoolpy")
          if ($warmTools.Count -ne 1) { throw "Expected exactly one cached esptool package" }
          $warmTool = $warmTools[0]
          if ($warmTool.version -ne "5.1.0" -or $warmTool.status -ne "present" -or
              $warmTool.url -ne $coldTool.url -or $warmTool.install_path -ne $coldTool.install_path) {
            throw "Warm check did not reuse the verified source launcher"
          }
          # The hosted runner discards RUNNER_TEMP after the job.
