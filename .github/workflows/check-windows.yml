name: Check Windows

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

# Auto-cancel superseded PR runs: pushing again to a feature branch
# supersedes the in-flight run instead of queueing behind it. Non-PR
# events key on run_id so each gets its own group -- a shared group keeps
# only ONE pending run, which would silently drop queued main SHAs.
concurrency:
  group: check-windows.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: Check (windows-latest)
    runs-on: windows-latest
    # Cold Windows workspace tests exceeded the old 30-minute cap in the
    # setup-soldr 0.9.25 full-coverage canary, and the lane's own steps now
    # total ~44-45 min, so runner variance tripped 45 (FastLED/fbuild#1710).
    timeout-minutes: 60
    env:
      SOLDR_S3_CACHE_ACCESS_KEY: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
      SOLDR_S3_CACHE_SECRET_KEY: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Setup soldr
        id: setup-soldr
        uses: zackees/setup-soldr@v0
        with:
          s3-bucket: forge-ci-cache
          s3-endpoint: sfo3.digitaloceanspaces.com
          cache-key-suffix: check-windows-check
          cache: true
          build-cache: true
          target-cache: true
          prebuild-deps: none
          # Opt out of the implicit `SOLDR_LINKER=fast` injection so cargo /
          # rust-toolchain.toml stays in charge. Silences the routine
          # "defaulting SOLDR_LINKER=fast" warning (issue #400 /
          # setup-soldr#377).
          linker: platform-default
          # Realistic zccache payload for the workspace check job is
          # ~1.5–2 GiB (issue #400). Raise the soft warn threshold above
          # the steady-state size so the action only flags genuinely
          # runaway caches. Hard cap stays at the action default (6 GiB).
          cache-payload-warn-bytes: 2GiB

      - name: Verify soldr
        shell: bash
        run: |
          version="$(soldr --version)"
          echo "$version"
          [[ "$version" == soldr\ * ]]
      # No separate `cargo check`: clippy type-checks the same
      # `--workspace --all-targets` set (see check-ubuntu.yml for the timing).
      - name: Setup uv for legacy source package install
        uses: astral-sh/setup-uv@v3

      # teknic.com is a single vendor host with no CDN. A release gate lost a
      # ClearCore fetch even after the downloader's 5 attempts over ~3 min,
      # so keep the installed core between runs. It is only ever read when
      # its `.install_complete` sentinel is present, and the key follows the
      # pinned URL and checksum in clearcore_core.rs.
      - name: Cache ClearCore core
        uses: actions/cache@v5
        with:
          path: ~/.fbuild/dev/cache/platforms/www-ClearCore-1.7.4
          key: fbuild-clearcore-${{ runner.os }}-${{ hashFiles('crates/fbuild-library/src/library/clearcore_core.rs') }}

      - name: Test SAMD architecture and interrupt override
        shell: bash
        env:
          FBUILD_DEV_MODE: "1"
        run: |
          soldr cargo test -p fbuild-build --test it samd_acceptance:: -- --ignored --nocapture

      - name: Clippy
        shell: bash
        run: soldr cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: soldr cargo test --workspace
      - name: Test large library archive
        shell: bash
        env:
          FBUILD_TEST_CC: C:/Program Files/LLVM/bin/clang.exe
          FBUILD_TEST_AR: C:/Program Files/LLVM/bin/llvm-ar.exe
        run: soldr cargo test -p fbuild-library large_archive_handles_windows_command_limit_and_quoted_paths -- --ignored --nocapture

      - name: Build UNO R4 with supported default core
        shell: bash
        env:
          FBUILD_DEV_MODE: "1"
        run: |
          soldr cargo test -p fbuild-build --test it renesas_acceptance:: -- --ignored --nocapture

      - name: Build Pico boot2 and default firmware
        shell: bash
        env:
          FBUILD_DEV_MODE: "1"
        run: |
          soldr cargo test -p fbuild-build --test it rp2040_acceptance:: -- --ignored --nocapture

      - name: Test ESP32-S3 linker overflow summary
        shell: bash
        env:
          FBUILD_DEV_MODE: "1"
        run: soldr cargo test -p fbuild-build --test it link_overflow::esp32s3_dram_overflow_still_fails_with_region_summary -- --ignored --nocapture

      # Exercise the real uv-created Windows launcher, beyond the unit fixture.
      # Cold public install runs fbuild's internal esptool version verification.
      - name: Install and recheck legacy ESP32 source tools
        id: legacy-esptool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $probe = Join-Path $env:RUNNER_TEMP ("fbuild-legacy-esptool-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $probe | Out-Null
          $env:FBUILD_CACHE_DIR = Join-Path $probe "cache"
          [Environment]::SetEnvironmentVariable("FBUILD_ESPTOOL_PATH", $null, "Process")
          @"
          [env:esp32-idf4]
          platform = espressif32@4.4.0
          board = esp32dev
          framework = arduino
          "@ | Set-Content -LiteralPath (Join-Path $probe "platformio.ini") -Encoding utf8

          $coldJson = & soldr cargo run -p fbuild-cli --bin fbuild -- install "$probe" -e esp32-idf4 --json
          if ($LASTEXITCODE -ne 0) { $coldJson | Write-Output; throw "Cold legacy ESP32 install failed ($LASTEXITCODE)" }
          $coldJson | Write-Output
          $cold = ($coldJson -join "`n") | ConvertFrom-Json
          $coldTools = @($cold.environments.packages | Where-Object name -eq "tool-esptoolpy")
          if ($coldTools.Count -ne 1) { throw "Expected exactly one esptool package" }
          $coldTool = $coldTools[0]
          if ($coldTool.version -ne "1.30300.0" -or $coldTool.status -ne "fetched") {
            throw "Expected a cold install of esptool 3.3 source package 1.30300.0"
          }
          if (-not (Test-Path -LiteralPath $coldTool.install_path -PathType Leaf)) {
            throw "Installed esptool launcher is missing"
          }
          if ($coldTool.install_path -notmatch '[\\/]\.fbuild-tools[\\/]esptool[\\/]Scripts[\\/]esptool\.exe$') {
            throw "Expected the real uv-managed Windows esptool launcher"
          }

          $warmJson = & soldr cargo run -p fbuild-cli --bin fbuild -- install "$probe" -e esp32-idf4 --check --json
          if ($LASTEXITCODE -ne 0) { $warmJson | Write-Output; throw "Warm legacy ESP32 check failed ($LASTEXITCODE)" }
          $warmJson | Write-Output
          $warm = ($warmJson -join "`n") | ConvertFrom-Json
          $warmTools = @($warm.environments.packages | Where-Object name -eq "tool-esptoolpy")
          if ($warmTools.Count -ne 1) { throw "Expected exactly one cached esptool package" }
          $warmTool = $warmTools[0]
          if ($warmTool.version -ne "1.30300.0" -or $warmTool.status -ne "present" -or
              $warmTool.install_path -ne $coldTool.install_path) {
            throw "Warm check did not reuse the verified source launcher"
          }
          # The hosted runner discards RUNNER_TEMP after the job.

      # Pioarduino 55.03.35 pins esptool 5.1.0, whose release has no
      # Windows standalone binary. Verify the real source-package route.
      - name: Install and recheck ESP32-C6 source tools
        id: modern-esptool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $probe = Join-Path $env:RUNNER_TEMP ("fbuild-modern-esptool-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $probe | Out-Null
          $env:FBUILD_CACHE_DIR = Join-Path $probe "cache"
          [Environment]::SetEnvironmentVariable("FBUILD_ESPTOOL_PATH", $null, "Process")
          @"
          [env:esp32c6-idf5]
          platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
          board = esp32-c6-devkitc-1
          framework = arduino
          "@ | Set-Content -LiteralPath (Join-Path $probe "platformio.ini") -Encoding utf8

          $coldJson = & soldr cargo run -p fbuild-cli --bin fbuild -- install "$probe" -e esp32c6-idf5 --json
          if ($LASTEXITCODE -ne 0) { $coldJson | Write-Output; throw "Cold ESP32-C6 install failed ($LASTEXITCODE)" }
          $coldJson | Write-Output
          $cold = ($coldJson -join "`n") | ConvertFrom-Json
          $coldTools = @($cold.environments.packages | Where-Object name -eq "tool-esptoolpy")
          if ($coldTools.Count -ne 1) { throw "Expected exactly one esptool package" }
          $coldTool = $coldTools[0]
          if ($coldTool.version -ne "5.1.0" -or $coldTool.status -ne "fetched" -or
              $coldTool.url -ne "https://github.com/pioarduino/esptool/releases/download/v5.1.0/esptool.zip") {
            throw "Expected a cold install of the pinned esptool 5.1.0 source archive"
          }
          if (-not (Test-Path -LiteralPath $coldTool.install_path -PathType Leaf)) {
            throw "Installed esptool launcher is missing"
          }
          if ($coldTool.install_path -notmatch '[\\/]\.fbuild-tools[\\/]esptool[\\/]Scripts[\\/]esptool\.exe$') {
            throw "Expected the real uv-managed Windows esptool launcher"
          }

          $warmJson = & soldr cargo run -p fbuild-cli --bin fbuild -- install "$probe" -e esp32c6-idf5 --check --json
          if ($LASTEXITCODE -ne 0) { $warmJson | Write-Output; throw "Warm ESP32-C6 check failed ($LASTEXITCODE)" }
          $warmJson | Write-Output
          $warm = ($warmJson -join "`n") | ConvertFrom-Json
          $warmTools = @($warm.environments.packages | Where-Object name -eq "tool-esptoolpy")
          if ($warmTools.Count -ne 1) { throw "Expected exactly one cached esptool package" }
          $warmTool = $warmTools[0]
          if ($warmTool.version -ne "5.1.0" -or $warmTool.status -ne "present" -or
              $warmTool.url -ne $coldTool.url -or $warmTool.install_path -ne $coldTool.install_path) {
            throw "Warm check did not reuse the verified source launcher"
          }
          # The hosted runner discards RUNNER_TEMP after the job.

      - name: Windows long-path repair and fallback smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $registry = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $original = Get-ItemPropertyValue -Path $registry -Name LongPathsEnabled -ErrorAction SilentlyContinue
          $buildOutput = @(& soldr cargo build -p fbuild-cli -p fbuild-daemon --bins --message-format=json)
          if ($LASTEXITCODE -ne 0) {
            $buildOutput | Write-Output
            throw 'could not build the Windows smoke binaries'
          }
          $binPaths = @{}
          foreach ($line in $buildOutput) {
            if (-not $line.StartsWith('{')) { continue }
            $artifact = $line | ConvertFrom-Json
            if ($artifact.reason -eq 'compiler-artifact' -and ($artifact.target.kind -contains 'bin') -and $artifact.executable) {
              $binPaths[$artifact.target.name] = $artifact.executable
            }
          }
          foreach ($name in @('fbuild', 'fbuild-daemon')) {
            if (-not $binPaths.ContainsKey($name) -or -not (Test-Path -LiteralPath $binPaths[$name] -PathType Leaf)) {
              throw "missing Windows smoke executable: $name"
            }
          }
          $cli = $binPaths['fbuild']
          $daemon = $binPaths['fbuild-daemon']
          foreach ($binary in @($cli, $daemon)) {
            $image = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($binary))
            if ($image -notmatch 'longPathAware[^>]*>true</' -or $image -notmatch 'level="asInvoker"') {
              throw "Missing Windows manifest in $binary"
            }
          }
          try {
            # This disposable hosted runner is already elevated. Exercise the
            # fixed helper without requiring an interactive UAC desktop.
            New-ItemProperty -Path $registry -Name LongPathsEnabled -PropertyType DWord -Value 0 -Force | Out-Null
            & $cli --__fix-win-helper
            if ($LASTEXITCODE -ne 0) { throw 'long-path helper failed' }
            if ((Get-ItemPropertyValue -Path $registry -Name LongPathsEnabled) -ne 1) {
              throw 'long-path helper did not verify its change'
            }
            & $cli --fix-win --no-update-check
            if ($LASTEXITCODE -ne 0) { throw 'already-enabled repair failed' }
            # Exercise the reported boards from a fresh, non-admin
            # profile while the machine-wide long-path policy remains off.
            New-ItemProperty -Path $registry -Name LongPathsEnabled -PropertyType DWord -Value 0 -Force | Out-Null
            $account = 'fb' + [Guid]::NewGuid().ToString('N').Substring(0, 12)
            $password = ConvertTo-SecureString ([Guid]::NewGuid().ToString('N') + 'Aa9!') -AsPlainText -Force
            $credential = [pscredential]::new("$env:COMPUTERNAME\$account", $password)
            $fixture = Join-Path $env:PUBLIC $account
            $fixedBase = Join-Path ("{0}\" -f $env:SystemDrive) 'fbuild-cache'
            if (Test-Path -LiteralPath $fixedBase) { throw "the native fixture needs an empty fixed cache base: $fixedBase" }
            try {
              $testUser = New-LocalUser -Name $account -Password $password
              Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $testUser
              New-Item -ItemType Directory -Path $fixture | Out-Null
              & icacls $fixture /grant "${account}:(OI)(CI)M" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'could not grant the test account access to its fixture' }
              Copy-Item $cli, $daemon -Destination $fixture
              @'
          $ErrorActionPreference = 'Stop'
          $env:CI = 'true'
          $env:FBUILD_DEV_MODE = '0'
          $env:RUNNING_PROCESS_DISABLE = '1'
          Remove-Item Env:FBUILD_CACHE_DIR, Env:FBUILD_BUILD_DIR -ErrorAction SilentlyContinue
          $registry = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          if ([Security.Principal.WindowsPrincipal]::new($identity).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'the fallback fixture must run as a non-administrator'
          }
          $profileKey = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\' + $identity.User.Value
          $profilePath = Get-ItemPropertyValue -LiteralPath $profileKey -Name ProfileImagePath
          $profilePath = [Environment]::ExpandEnvironmentVariables($profilePath)
          if (-not (Test-Path -LiteralPath $profilePath -PathType Container)) {
            throw "the standard-user profile directory was not loaded: $profilePath"
          }
          $env:USERPROFILE = $profilePath
          $env:HOME = $profilePath
          $env:LOCALAPPDATA = Join-Path $profilePath 'AppData\Local'
          $env:APPDATA = Join-Path $profilePath 'AppData\Roaming'
          $env:UV_CACHE_DIR = Join-Path $env:LOCALAPPDATA 'uv\cache'
          $env:TEMP = Join-Path $env:LOCALAPPDATA 'Temp'
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          if ((Get-ItemPropertyValue -Path $registry -Name LongPathsEnabled) -ne 0) {
            throw 'long paths must be disabled before fallback testing'
          }
          $fixedBase = Join-Path ("{0}\" -f $env:SystemDrive) 'fbuild-cache'
          Set-Location $PSScriptRoot
          New-Item -ItemType Directory -Path 'src' | Out-Null
          @"
          [env:esp32s3]
          platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
          board = esp32-s3-devkitc-1
          framework = arduino

          [env:rpipicow]
          platform = raspberrypi
          board = rpipicow
          framework = arduino

          [env:teensy41]
          platform = teensy
          board = teensy41
          framework = arduino

          [env:blackpill_f411ce]
          platform = ststm32
          board = blackpill_f411ce
          framework = arduino
          "@ | Set-Content platformio.ini
          @"
          #include <Arduino.h>
          void setup() {}
          void loop() {}
          "@ | Set-Content src/main.cpp
          try {
            & .\fbuild.exe --no-update-check install -e esp32s3
            if ($LASTEXITCODE -ne 0) { throw "cold ESP32-S3 install failed: $LASTEXITCODE" }
            & .\fbuild.exe --no-update-check build -e esp32s3 --no-timestamp
            if ($LASTEXITCODE -ne 0) { throw "ESP32-S3 build failed: $LASTEXITCODE" }
            $selection = Get-Content (Join-Path $env:USERPROFILE '.fbuild\prod\windows-short-paths-v2.json') -Raw | ConvertFrom-Json
            $fixedPattern = '^' + [regex]::Escape($fixedBase.Replace('\', '/')) + '/[0-9a-f]{12}/p/c$'
            if ($selection.cache_root.Replace('\', '/') -notmatch $fixedPattern) {
              throw "standard user did not select the fixed cache: $($selection.cache_root)"
            }
            $packages = @(Get-ChildItem -LiteralPath $selection.cache_root -Directory | Where-Object { $_.Name -match '^[0-9a-f]{16}$' })
            if ($packages.Count -lt 2) { throw 'expected compact toolchain and framework installs' }
            foreach ($boardEnv in @('rpipicow', 'teensy41', 'blackpill_f411ce')) {
              & .\fbuild.exe --no-update-check build -e $boardEnv --no-timestamp
              if ($LASTEXITCODE -ne 0) { throw "${boardEnv} build failed: $LASTEXITCODE" }
              $previousCount = $packages.Count
              $packages = @(Get-ChildItem -LiteralPath $selection.cache_root -Directory | Where-Object { $_.Name -match '^[0-9a-f]{16}$' })
              if ($packages.Count -le $previousCount) { throw "expected a compact core install for $boardEnv" }
            }
            foreach ($package in $packages) {
              Get-ChildItem -LiteralPath $package.FullName -Recurse -Force | ForEach-Object {
                $limit = if ($_.PSIsContainer) { 247 } else { 259 }
                if ($_.FullName.Length -gt $limit) { throw "legacy path limit exceeded: $($_.FullName)" }
              }
            }
            if ((Get-ItemPropertyValue -Path $registry -Name LongPathsEnabled) -ne 0) {
              throw 'long-path policy changed during fallback testing'
            }
          } finally {
            & .\fbuild.exe --no-update-check daemon stop
            if ($LASTEXITCODE -ne 0) { throw "standard-user daemon did not stop: $LASTEXITCODE" }
            if (Test-Path -LiteralPath $fixedBase) { Remove-Item -LiteralPath $fixedBase -Recurse -Force }
          }
          '@ | Set-Content (Join-Path $fixture 'verify-fallback.ps1')
              $test = Start-Process (Join-Path $PSHOME 'pwsh.exe') -Credential $credential -LoadUserProfile -PassThru `
                -ArgumentList '-NoProfile', '-File', ('"{0}"' -f (Join-Path $fixture 'verify-fallback.ps1')) `
                -RedirectStandardOutput (Join-Path $fixture 'stdout.log') -RedirectStandardError (Join-Path $fixture 'stderr.log')
              $finished = $test.WaitForExit(1200000)
              if (-not $finished) { $test.Kill($true) }
              Get-Content (Join-Path $fixture 'stdout.log'), (Join-Path $fixture 'stderr.log')
              if (-not $finished) { throw 'standard-user fallback test timed out' }
              if ($test.ExitCode -ne 0) { throw "standard-user fallback failed: $($test.ExitCode)" }
            } finally {
              Remove-LocalUser -Name $account -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $fixture -Recurse -Force -ErrorAction SilentlyContinue
            }
            New-ItemProperty -Path $registry -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force | Out-Null
            $env:FBUILD_DEV_MODE = '0'
            $env:RUNNING_PROCESS_DISABLE = '1'
            & $cli --no-update-check build tests/platform/uno --dry-run
            if ($LASTEXITCODE -ne 0) { throw 'enabled daemon startup failed' }
            $before = Get-Content (Join-Path $env:USERPROFILE '.fbuild\prod\daemon\root-owner.json') -Raw | ConvertFrom-Json
            New-ItemProperty -Path $registry -Name LongPathsEnabled -PropertyType DWord -Value 0 -Force | Out-Null
            $env:CI = 'true'
            $output = & $cli --no-update-check install tests/platform/esp32dev --dry-run --json 2> long-path-warning.txt
            $code = $LASTEXITCODE
            if ($code -ne 0) { throw "fallback package preview failed: $code" }
            $output | ConvertFrom-Json | Out-Null
            $warning = Get-Content long-path-warning.txt -Raw
            if ($warning -notmatch 'WARNING:' -or $warning -notmatch 'fix-win' -or $warning.Contains([char]27)) {
              throw 'fallback warning is missing or contains ANSI in redirected stderr'
            }
            $fallbackBase = Join-Path $env:SystemDrive 'fbuild-cache'
            $fallbackPattern = [regex]::Escape($fallbackBase) + '\\[0-9a-f]{12}\\p\\c'
            $selected = [regex]::Match($warning, $fallbackPattern, 'IgnoreCase')
            if (-not $selected.Success) {
              throw "fallback cache was not selected under $fallbackBase"
            }
            $fallbackRoot = Split-Path -Parent $selected.Value
            & $cli --no-update-check build tests/platform/uno --dry-run
            if ($LASTEXITCODE -ne 0) { throw 'disabled-policy daemon handoff failed' }
            $after = Get-Content (Join-Path $env:USERPROFILE '.fbuild\prod\daemon\root-owner.json') -Raw | ConvertFrom-Json
            if ($before.pid -eq $after.pid) { throw 'daemon was reused after the registry changed' }
            $fallbackPid = Get-Content (Join-Path $fallbackRoot 'daemon\fbuild_daemon.pid') -Raw
            if ([int]$fallbackPid -ne $after.pid) {
              throw "fallback daemon PID was not written under $fallbackRoot"
            }
            New-ItemProperty -Path $registry -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force | Out-Null
            & $cli --no-update-check build tests/platform/uno --dry-run
            if ($LASTEXITCODE -ne 0) { throw 'enabled-policy daemon handoff failed' }
            $repairedPid = Get-Content (Join-Path $fallbackRoot 'daemon\fbuild_daemon.pid') -Raw
            if ([int]$repairedPid -eq $after.pid) { throw 'daemon was reused after long paths were enabled' }
            & $cli --no-update-check daemon stop
            if ($LASTEXITCODE -ne 0) { throw 'smoke daemon did not stop' }

          } finally {
            if ($null -eq $original) {
              Remove-ItemProperty -Path $registry -Name LongPathsEnabled -ErrorAction SilentlyContinue
            } else {
              New-ItemProperty -Path $registry -Name LongPathsEnabled -PropertyType DWord -Value $original -Force | Out-Null
            }
          }
