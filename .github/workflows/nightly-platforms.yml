# Board dispatcher: path-selected on push to main, all boards nightly.
# See FastLED/fbuild#835 and ci/select_boards.py.
#
# This file is AUTOGENERATED from ci/board_families.json.
# Edit the SOT and re-run `uv run python ci/render_workflows.py`.
# The CI drift gate (.github/workflows/ci-workflow-drift.yml) enforces this.
name: Nightly Platforms

on:
  push:
    branches: [main]
  schedule:
    # 11:00 UTC = 03:00 PST (winter) / 04:00 PDT (summer). GitHub cron
    # has no timezone, so one of the two has to drift; 3am standard
    # time is the one asked for (FastLED/fbuild#1396). See also #835.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Dispatch all platform builds even without recent commits'
        type: boolean
        default: false

jobs:
  plan:
    name: Select boards
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.select.outputs.workflows }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ]; then
            args=(--base "$BEFORE" --head "$GITHUB_SHA")
          elif [ "$EVENT" = schedule ] && [ -z "$(git log --since='24 hours ago' --oneline HEAD)" ]; then
            echo 'No commits in the last 24h -- nothing to dispatch'
            echo 'workflows=[]' >> "$GITHUB_OUTPUT"
            exit 0
          else
            args=(--all)
          fi
          workflows=$(cd ci && uv run --no-project python select_boards.py "${args[@]}")
          echo "selected: $workflows"
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"

  fbuild_bin:
    name: Build fbuild (shared by board jobs)
    if: needs.plan.outputs.workflows != '[]'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
      SOLDR_TARGET_BLOCK_FREE_GB: "2"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: zackees/setup-soldr@dfbe9627f6cb0226716b61625b99a58949162720
        with:
          cache-preset: foundation
          prebuild-deps-flags: ""
          prebuild-deps: none
          linker: platform-default
          cache-payload-warn-bytes: 2GiB
          cache-key-suffix: fbuild-rust-debug
          save-cache: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
      - run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 install -y libudev-dev pkg-config
      - run: soldr cargo build -p fbuild-cli -p fbuild-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: fbuild-bin-linux-debug
          path: |
            target/debug/fbuild
            target/debug/fbuild-daemon
          if-no-files-found: error
          retention-days: 1
  dispatch:
    name: Dispatch board workflows
    needs: [plan, fbuild_bin]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOWS: ${{ needs.plan.outputs.workflows }}
        run: |
          failed=()
          for wf in $(echo "$WORKFLOWS" | jq -r '.[]'); do
            if gh workflow run "$wf" --ref "$GITHUB_REF_NAME" \
              -f fbuild-run-id="$GITHUB_RUN_ID" -f checkout_ref="$GITHUB_SHA"; then
              echo "dispatched $wf"
            else
              echo "::error::failed to dispatch $wf"
              failed+=("$wf")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "failed to dispatch: ${failed[*]}" >&2
            exit 1
          fi
