name: Build Arduino Giga R1

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/giga_r1_m7/**'
      - 'crates/fbuild-build-arm/src/stm32/**'
      - '.github/workflows/build-giga-r1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/giga_r1_m7/**'
      - 'crates/fbuild-build-arm/src/stm32/**'
      - '.github/workflows/build-giga-r1.yml'

concurrency:
  group: build-giga-r1.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "Arduino Giga R1"
      test-dir: "tests/platform/giga_r1_m7"
      env-name: "giga_r1"
      firmware-ext: "bin"
