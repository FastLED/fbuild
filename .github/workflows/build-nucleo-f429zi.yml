name: Build Nucleo F429ZI

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/nucleo_f429zi/**'
      - 'crates/fbuild-build-arm/src/stm32/**'
      - '.github/workflows/build-nucleo-f429zi.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/nucleo_f429zi/**'
      - 'crates/fbuild-build-arm/src/stm32/**'
      - '.github/workflows/build-nucleo-f429zi.yml'

concurrency:
  group: build-nucleo-f429zi.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "Nucleo F429ZI"
      test-dir: "tests/platform/nucleo_f429zi"
      env-name: "nucleo_f429zi"
      firmware-ext: "hex"
