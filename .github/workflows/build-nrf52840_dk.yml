name: Build nRF52840 DK

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/nrf52840_dk/**'
      - 'crates/fbuild-build-arm/src/nrf52/**'
      - '.github/workflows/build-nrf52840_dk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/nrf52840_dk/**'
      - 'crates/fbuild-build-arm/src/nrf52/**'
      - '.github/workflows/build-nrf52840_dk.yml'

concurrency:
  group: build-nrf52840_dk.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "nRF52840 DK"
      test-dir: "tests/platform/nrf52840_dk"
      env-name: "nrf52840_dk"
      firmware-ext: "hex"
