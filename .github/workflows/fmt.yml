name: Formatting

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Auto-cancel superseded PR runs: pushing again to a feature branch
# supersedes the in-flight run instead of queueing behind it. Non-PR
# events key on run_id so each gets its own group -- a shared group keeps
# only ONE pending run, which would silently drop queued main SHAs.
concurrency:
  group: fmt.yml-${{ inputs.ref != '' && github.run_id || (github.event_name == 'pull_request' && github.ref || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CACHE-034 (zackees/ci.yml#352/#354/#360): this job runs the pre-prune
    # ahead of its own setup-soldr save; `actions: write` is what the cache
    # deletions need (allow-listed in ci.toml's [allow.permissions]).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          # HEAD^ must exist for ci/lockfile_changed.py (CACHE-034).
          fetch-depth: 2
      # CACHE-034 (zackees/ci.yml#352/#354/#360): honour [flow.main]'s
      # `pre-prune = true` waiver. The prune runs in this job, ahead of the
      # setup-soldr save below -- within the same run means same job or an
      # earlier `needs:` link, and GitHub Actions has no cross-workflow
      # barrier. The ci-lint checkout matches ci.toml's `linter` pin (CT-004).
      - name: Check out ci-lint
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: zackees/ci.yml
          ref: 92106df315bd28de24ef1808c893c91a5859122d
          path: .ci-lint
          persist-credentials: false
      - name: Detect lockfile change vs parent commit
        id: lockfile
        run: python3 ci/lockfile_changed.py
      - name: Pre-prune superseded lockfile-keyed caches (CACHE-034)
        if: github.event_name != 'pull_request' && steps.lockfile.outputs.changed == 'true' && github.token != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .ci-lint
        run: python3 -m ci_lint cache preprune --repo . --lockfile-changed --max-deletes 50
      - name: Setup soldr
        id: setup-soldr
        uses: zackees/setup-soldr@v0
        with:
          cache-key-suffix: fmt-fmt
          cache: true
          build-cache: true
          target-cache: false
          prebuild-deps: none
          # Opt out of the implicit `SOLDR_LINKER=fast` injection so cargo /
          # rust-toolchain.toml stays in charge. Silences the routine
          # "defaulting SOLDR_LINKER=fast" warning (issue #400 /
          # setup-soldr#377). `cargo fmt` does not link anything so this
          # is purely cosmetic, but it removes the annotation.
          linker: platform-default
      # setup-soldr provisions the pinned toolchain with profile=minimal,
      # which omits rustfmt. Without this step, `cargo fmt` silently falls
      # back to the runner's preinstalled (newer) stable rustfmt, whose
      # import-sorting/width rules differ from the pinned 1.95.0 — every
      # cache-miss run then fails with diffs the pinned toolchain does not
      # produce.
      - name: Install rustfmt for the pinned toolchain
        run: soldr rustup component add rustfmt
      - name: Check formatting
        run: soldr cargo fmt --all -- --check
