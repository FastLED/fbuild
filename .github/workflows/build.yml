name: Build Native Binaries

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: "main"

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  build:
    # timeout-minutes is set on the reusable workflow's job
    # (template_native_build.yml -> jobs.build.timeout-minutes: 90).
    # GHA does not allow `timeout-minutes:` at the caller `jobs.<id>:`
    # level when the job uses `uses:` (reusable workflow).
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            binary_ext: ""
            linux_cross: false
            macos_cross: false

          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            binary_ext: ""
            linux_cross: true
            macos_cross: false

          # x86_64-apple-darwin is not built here. This workflow builds
          # binaries on demand; the release matrix (release-auto.yml) is
          # what produces the Intel archive when a release needs one, and
          # it cross-builds that target from Linux too.

          # aarch64-apple-darwin cross-compiles from the Linux runner via
          # soldr + cargo-zigbuild + soldr's managed Apple SDK, matching the
          # release matrix. No macos-latest runner is used anywhere in this
          # workflow.
          - target: aarch64-apple-darwin
            runner: ubuntu-latest
            binary_ext: ""
            linux_cross: false
            macos_cross: false
            mac_cross_linux: true

          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary_ext: ".exe"
            linux_cross: false
            macos_cross: false

    uses: ./.github/workflows/template_native_build.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      binary_ext: ${{ matrix.binary_ext }}
      linux_cross: ${{ matrix.linux_cross }}
      macos_cross: ${{ matrix.macos_cross }}
      mac_cross_linux: ${{ matrix.mac_cross_linux == true }}
      ref: ${{ github.event.inputs.ref || 'main' }}
