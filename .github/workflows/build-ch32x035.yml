name: Build CH32X035

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/ch32x035/**'
      - 'crates/fbuild-build-mcu/src/ch32v/**'
      - '.github/workflows/build-ch32x035.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/ch32x035/**'
      - 'crates/fbuild-build-mcu/src/ch32v/**'
      - '.github/workflows/build-ch32x035.yml'

concurrency:
  group: build-ch32x035.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "CH32X035"
      test-dir: "tests/platform/ch32x035"
      env-name: "ch32x035"
      firmware-ext: "bin"
