name: Build Raspberry Pi Pico 2

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/rpipico2/**'
      - 'crates/fbuild-build-arm/src/rp2040/**'
      - '.github/workflows/build-rpipico2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/rpipico2/**'
      - 'crates/fbuild-build-arm/src/rp2040/**'
      - '.github/workflows/build-rpipico2.yml'

concurrency:
  group: build-rpipico2.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "Raspberry Pi Pico 2"
      test-dir: "tests/platform/rpipico2"
      env-name: "rpipico2"
      firmware-ext: "bin"
