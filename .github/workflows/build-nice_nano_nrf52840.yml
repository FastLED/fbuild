name: Build nice!nano nRF52840

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/nice_nano_nrf52840/**'
      - 'crates/fbuild-build-arm/src/nrf52/**'
      - '.github/workflows/build-nice_nano_nrf52840.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/nice_nano_nrf52840/**'
      - 'crates/fbuild-build-arm/src/nrf52/**'
      - '.github/workflows/build-nice_nano_nrf52840.yml'

concurrency:
  group: build-nice_nano_nrf52840.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "nice!nano nRF52840"
      test-dir: "tests/platform/nice_nano_nrf52840"
      env-name: "nice_nano_nrf52840"
      firmware-ext: "hex"
