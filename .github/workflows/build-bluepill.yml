name: Build BluePill F103C8

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: build-bluepill.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
