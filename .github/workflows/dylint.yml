name: Dylint

# One Linux Dylint pass and the policy checks feed the required Dylint status.
# Full CI calls the same workflow.

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  pull_request:
    branches: [main]

# Auto-cancel superseded PR runs: pushing again to a feature branch
# supersedes the in-flight run instead of queueing behind it. Non-PR
# events key on run_id so each gets its own group -- a shared group keeps
# only ONE pending run, which would silently drop queued main SHAs.
concurrency:
  group: dylint.yml-${{ inputs.ref != '' && github.run_id || (github.event_name == 'pull_request' && github.ref || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token. Every step here reads: checkout, a shallow `git fetch
# origin main` for the shrink-only allowlist diff, and lint runs. Nothing
# writes, so nothing should be able to. Without this the job inherits the
# repository/organization default, which can include write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  policy:
    name: Dylint policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v3
      - name: Validate Dylint policy files
        run: |
          uv run --no-project python ci/check_dylint_allowlists.py
          uv run --no-project python ci/enforce_platform_boundary.py --print-totals

  dylint:
    name: Dylint workspace
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v3
      - name: Validate Dylint allowlist paths
        run: uv run --no-project python ci/check_dylint_allowlists.py
      - name: Enforce shrink-only .fbuild allowlist
        # The baseline in dylints/ban_raw_fbuild_path may only shrink
        # (FastLED/fbuild#1349). Needs main fetched to diff against.
        run: |
          git fetch --no-tags --depth=1 origin main
          uv run --no-project python ci/check_fbuild_path_baseline.py --base FETCH_HEAD
      - name: Validate platform-boundary ledgers
        run: uv run --no-project python ci/enforce_platform_boundary.py --print-totals
      - uses: zackees/setup-soldr@v0
        with:
          # ci-tests applies the prescribed bounded resource contract for the
          # workspace validation domain. Dylint deliberately remains on its
          # separate pinned nightly/driver lifecycle in the explicit steps
          # below, so it cannot invalidate the stable target tree.
          cache: true
          toolchain: 1.95.0
          cache-key-suffix: dylint
          prebuild-deps: none
          ci-tests: true
          dylint-toolchain: nightly-2026-05-28
          cargo-dylint-version: 6.0.3
          dylint-link-version: 6.0.3
          # Opt out of the implicit `SOLDR_LINKER=fast` injection so cargo /
          # rust-toolchain.toml stays in charge. Silences the routine
          # "defaulting SOLDR_LINKER=fast" warning (issue #400 /
          # setup-soldr#377).
          linker: platform-default
          # Dylint's lint libraries pull in a full rustc-dev tree on first run
          # which can push the build-cache past the 512 MiB action default
          # (issue #400). Raise the soft warn threshold; hard cap stays
          # at the action default (6 GiB).
          cache-payload-warn-bytes: 2GiB
      - name: Prepare prebuilt Dylint tools and driver
        timeout-minutes: 10
        run: |
          env -u RUSTUP_TOOLCHAIN soldr dylint prepare 2>&1 | tee "$RUNNER_TEMP/dylint-prepare.log"
          # Library UI tests invoke soldr cargo test separately, so preserve
          # the prebuilt dylint-link directory for their linker config.
          sed -n 's/^soldr: dylint prepare: tool bin dir //p' "$RUNNER_TEMP/dylint-prepare.log" >> "$GITHUB_PATH"
      - name: Check Dylint library formatting
        run: |
          while IFS= read -r manifest; do
            RUSTUP_TOOLCHAIN=nightly-2026-05-28 \
              soldr cargo fmt --manifest-path "$manifest" --all -- --check
          done < <(find dylints -mindepth 2 -maxdepth 2 -name Cargo.toml | sort)
      - name: Test Dylint libraries
        # UI fixtures assert that each custom lint fires on its fixture.
        run: |
          # UI fixtures launch nested Cargo. Keep the rustup proxy visible so
          # it can select each lint's pinned nightly.
          CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          CARGO_BIN="${CARGO_HOME}/bin"
          export PATH="${CARGO_BIN}:${PATH}"
          export CARGO_TARGET_DIR="$PWD/target/dylint-tests"
          # UI fixtures invoke Cargo outside soldr's Dylint front door.
          # Reuse the verified driver fetched by `soldr dylint prepare`.
          export DYLINT_DRIVER_PATH="${SOLDR_CACHE_DIR:?}/dylint/drivers"
          # Dylint's UI runner asks for the short nightly directory; Soldr's
          # verified asset lives under the host-qualified directory.
          host="$(RUSTUP_TOOLCHAIN=nightly-2026-05-28 soldr rustc -vV | sed -n 's/^host: //p')"
          short="nightly-2026-05-28"
          qualified="${short}-${host}"
          test -f "$DYLINT_DRIVER_PATH/$qualified/dylint-driver"
          test -d "${RUSTUP_HOME:?}/toolchains/$qualified"
          ln -sfnT "$qualified" "$DYLINT_DRIVER_PATH/$short"
          # The driver reads RUSTUP_HOME/toolchains/$RUSTUP_TOOLCHAIN
          # literally. Cargo's short nightly tag must resolve to the same
          # installed sysroot while keeping the lint library's short tag.
          ln -sfnT "$qualified" "$RUSTUP_HOME/toolchains/$short"
          while IFS= read -r manifest; do
            RUSTUP_TOOLCHAIN=nightly-2026-05-28 \
              soldr cargo test --manifest-path "$manifest"
          done < <(find dylints -mindepth 2 -maxdepth 2 -name Cargo.toml | sort)
      - name: Run dylint over workspace
        env:
          FBUILD_PLATFORM_BOUNDARY_OBSERVED: ${{ github.workspace }}/target/platform-boundary-dylint-observed.tsv
        run: |
          # Force fresh workspace traversal for the observation ledger while
          # preserving Cargo's cached dependencies. A per-run RUSTFLAGS value
          # invalidated every dependency, causing a cold rebuild on each run.
          find crates -type f -name '*.rs' -exec touch {} +
          rm -f "$FBUILD_PLATFORM_BOUNDARY_OBSERVED"
          env -u RUSTUP_TOOLCHAIN soldr dylint --all -- --workspace --all-targets
      - name: Compare scanner with actual Dylint observations
        run: uv run --no-project python ci/enforce_platform_boundary.py --dylint-observed target/platform-boundary-dylint-observed.tsv --print-totals

  gate:
    name: Dylint
    if: always()
    needs: [policy, dylint]
    runs-on: ubuntu-latest
    steps:
      - env:
          POLICY: ${{ needs.policy.result }}
          FULL_DYLINT: ${{ needs.dylint.result }}
        run: |
          test "$POLICY" = success
          test "$FULL_DYLINT" = success
