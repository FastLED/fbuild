name: Dylint

# The required PR Dylint status covers Linux host code quickly. ci-full and
# manual dispatch check Linux, Windows, and macOS targets on one Linux builder.

on:
  workflow_dispatch:
    inputs:
      all_targets:
        description: Cover every soldr shipping target and run all lint UI tests
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      # Which call site this is. One workflow run can call this file twice
      # (ci-minimal directly, ci-full from its own `dylint` job) and the
      # `github` context of a called workflow always belongs to the TOP-LEVEL
      # caller, so `github.workflow`/`github.run_id` are identical for both.
      # Without a caller-supplied lane the two calls shared a concurrency
      # group and cancelled each other (FastLED/fbuild#1874).
      lane:
        type: string
        required: false
        default: "standalone"
  # PRs, merge-queue runs and main pushes all reach Dylint through
  # ci-minimal.yml's workflow_call (gated by the single required "CI
  # summary" check). setup-soldr skips cache uploads on PRs; ci-minimal's
  # main-push call seeds the shared three-target Dylint caches that PRs
  # restore. There is deliberately no standalone `push` trigger: it shared
  # that call's output-cache key and, being Linux-only and faster, always
  # won the save, so the Windows/macOS check tree was never persisted.

# Auto-cancel superseded PR runs: pushing again to a feature branch
# supersedes the in-flight run instead of queueing behind it. Non-PR
# events key on run_id so each gets its own group -- a shared group keeps
# only ONE pending run, which would silently drop queued main SHAs.
#
# `inputs.lane` is the call site, and it must be in the group: one run can
# call this file twice (ci-minimal directly, ci-full from its own `dylint`
# job) while `github.run_id` -- and `github.workflow`, which inside a called
# workflow belongs to the TOP-LEVEL caller -- are the same for both. Keyed
# on the run alone, the second call cancelled the first and `dylint /
# Dylint` failed on every `ci-full` PR (FastLED/fbuild#1874).
concurrency:
  group: dylint.yml-${{ inputs.lane }}-${{ inputs.ref != '' && github.run_id || (github.event_name == 'pull_request' && github.ref || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token. Every step here reads: checkout, a shallow `git fetch
# origin main` for the shrink-only allowlist diff, and lint runs. Nothing
# writes, so nothing should be able to. Without this the job inherits the
# repository/organization default, which can include write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  policy:
    name: Dylint policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
      - name: Validate Dylint policy files
        run: |
          uv run --no-project python ci/check_dylint_allowlists.py
          uv run --no-project python ci/enforce_platform_boundary.py --print-totals

  dylint:
    name: Dylint Full (Linux builder, all OS targets)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
      - name: Provision cold-build disk capacity
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: uv run --no-project python ci/reclaim_android_ndks.py
      - name: Validate Dylint allowlist paths
        run: uv run --no-project python ci/check_dylint_allowlists.py
      - name: Enforce shrink-only .fbuild allowlist
        # The baseline in dylints/ban_raw_fbuild_path may only shrink
        # (FastLED/fbuild#1349). Needs main fetched to diff against.
        run: |
          git fetch --no-tags --depth=1 origin main
          uv run --no-project python ci/check_fbuild_path_baseline.py --base FETCH_HEAD
      - name: Validate platform-boundary ledgers
        run: uv run --no-project python ci/enforce_platform_boundary.py --print-totals
      - name: Setup soldr
        uses: zackees/setup-soldr@e6eda4bb48dcef5bbb4425fff3084d8985bbe273
        with:
          # ci-tests applies the prescribed bounded resource contract for the
          # workspace validation domain. Dylint deliberately remains on its
          # separate pinned nightly/driver lifecycle in the explicit steps
          # below, so it cannot invalidate the stable target tree.
          cache: true
          save-cache: true
          cargo-registry-cache: true
          dylint: true
          dylint-cache: true
          dylint-foundation-cache: true
          # The nightly check tree is what makes Dylint slow: it is built by a
          # different compiler from the stable workspace build, so nothing else
          # persists it. This layer saves target/dylint/{libraries,target}/
          # <nightly>-<host> after a successful run. Its key has been commit-free
          # since setup-soldr#540 (toolchain, driver, manifests, target shape,
          # Cargo.lock; restore drops only the lockfile), and cargo's own
          # fingerprints recheck whatever changed. It supersedes the bespoke
          # short-path lint-library cache this job used to carry.
          dylint-output-cache: true
          toolchain: 1.95.0
          # The old "dylint" key contains an immutable, empty build-cache
          # entry. Use a fresh stable key shared by main and future PRs.
          cache-key-suffix: dylint-unified-v2
          prebuild-deps: none
          ci-tests: true
          dylint-toolchain: nightly-2026-08-15
          cargo-dylint-version: 6.2.0
          dylint-link-version: 6.2.0
          # Opt out of the implicit `SOLDR_LINKER=fast` injection so cargo /
          # rust-toolchain.toml stays in charge. Silences the routine
          # "defaulting SOLDR_LINKER=fast" warning (issue #400 /
          # setup-soldr#377).
          linker: platform-default
          # Dylint's lint libraries pull in a full rustc-dev tree on first run
          # which can push the build-cache past the 512 MiB action default
          # (issue #400). Raise the soft warn threshold; hard cap stays
          # at the action default (6 GiB).
          cache-payload-warn-bytes: 2GiB
      # setup-soldr's cargo-registry cache restores extracted crate sources
      # without non-source `.tar` payloads, so `dylint_internal`'s
      # `include_bytes!("template.tar")` fails whenever the lint libraries
      # rebuild (any change under dylints/). Drop such incomplete extractions
      # so cargo re-unpacks them from the `.crate` archive (or re-downloads).
      - name: Repair registry sources missing packaged files
        run: |
          for src in "$HOME"/.cargo/registry/src/*/dylint_internal-*; do
            [ -d "$src" ] || continue
            if [ ! -f "$src/template.tar" ]; then
              echo "::warning::re-extracting $(basename "$src"): template.tar missing from restored registry cache"
              rm -rf "$src"
            fi
          done
      # Host Clippy on the stable workspace toolchain lives here rather than
      # in check-ubuntu.yml's `check` job, which the local gate replays
      # through bosn; lint never runs under bosn (GATE-016).
      - name: Clippy
        run: soldr cargo clippy --workspace --all-targets -- -D warnings
      - name: Prepare prebuilt Dylint tools and driver
        timeout-minutes: 10
        run: |
          env -u RUSTUP_TOOLCHAIN soldr dylint prepare 2>&1 | tee "$RUNNER_TEMP/dylint-prepare.log"
          # Library UI tests invoke soldr cargo test separately, so preserve
          # the prebuilt dylint-link directory for their linker config.
          sed -n 's/^soldr: dylint prepare: tool bin dir //p' "$RUNNER_TEMP/dylint-prepare.log" >> "$GITHUB_PATH"
      # setup-soldr prepares the nightly with a minimal profile. The Dylint
      # library formatting check below needs rustfmt on that exact nightly.
      - name: Install rustfmt for the Dylint toolchain
        run: soldr rustup component add --toolchain nightly-2026-08-15 rustfmt
      - name: Check Dylint library formatting
        run: |
          while IFS= read -r manifest; do
            RUSTUP_TOOLCHAIN=nightly-2026-08-15 \
              soldr cargo fmt --manifest-path "$manifest" --all -- --check
          done < <(find dylints -mindepth 2 -maxdepth 2 -name Cargo.toml | sort)
      - name: Test Dylint libraries
        # UI fixtures execute on the Linux host; workspace checks below use
        # the same host lint libraries against each platform target.
        env:
          ALL_TARGETS: ${{ inputs.all_targets }}
        run: |
          # UI fixtures test the lint implementations themselves. Repeating
          # all 27 suites on a workflow-only or application-only PR spends
          # minutes compiling their separate test-profile trees.
          if [ "$ALL_TARGETS" != true ] && git diff --quiet FETCH_HEAD HEAD -- dylints; then
            echo "Dylint sources unchanged; skipping library UI fixtures"
            exit 0
          fi
          # UI fixtures launch nested Cargo. Keep the rustup proxy visible so
          # it can select each lint's pinned nightly.
          CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          CARGO_BIN="${CARGO_HOME}/bin"
          export PATH="${CARGO_BIN}:${PATH}"
          export CARGO_TARGET_DIR="$PWD/target/dylint-tests"
          # UI fixtures invoke Cargo outside soldr's Dylint front door.
          # Reuse the verified driver path exported by setup-soldr's Dylint
          # mode; it owns the driver cache outside SOLDR_CACHE_DIR.
          : "${DYLINT_DRIVER_PATH:?}"
          # Dylint's UI runner asks for the short nightly directory; Soldr
          # 0.9.47+ stages the verified driver under both names.
          host="$(RUSTUP_TOOLCHAIN=nightly-2026-08-15 soldr rustc -vV | sed -n 's/^host: //p')"
          short="nightly-2026-08-15"
          qualified="${short}-${host}"
          test -f "$DYLINT_DRIVER_PATH/$qualified/dylint-driver"
          test -f "$DYLINT_DRIVER_PATH/$short/dylint-driver"
          test -d "${RUSTUP_HOME:?}/toolchains/$qualified"
          # The driver reads RUSTUP_HOME/toolchains/$RUSTUP_TOOLCHAIN
          # literally. Cargo's short nightly tag must resolve to the same
          # installed sysroot while keeping the lint library's short tag.
          ln -sfnT "$qualified" "$RUSTUP_HOME/toolchains/$short"
          while IFS= read -r manifest; do
            RUSTUP_TOOLCHAIN=nightly-2026-08-15 \
              soldr cargo test --manifest-path "$manifest"
          done < <(find dylints -mindepth 2 -maxdepth 2 -name Cargo.toml | sort)
      - name: Run dylint over workspace
        env:
          ALL_TARGETS: ${{ inputs.all_targets }}
          FULL_TARGETS: ${{ inputs.ref != '' || github.event_name == 'workflow_dispatch' }}
          # The platform-boundary check below reads the observation TSVs a
          # real Dylint pass writes. A soldr verdict hit (same inputs as an
          # earlier green run, e.g. the release dry run) skips the pass and
          # leaves no TSVs, failing the release's full validation.
          SOLDR_VERDICTS: "off"
        run: |
          status=0
          # The Linux pass covers the whole workspace. Cross-target passes
          # need only crates with target-specific source in the checked-in
          # boundary baseline; deriving this list makes new platform code
          # enter the cross-target check when its ledger is updated.
          #
          # An EMPTY baseline is phase 9's terminal state and is legitimate:
          # no crate carries target-specific source any more, so there is
          # nothing a cross-target pass could police. The row count is what
          # tells an empty ledger apart from a parse regression, so a
          # non-empty ledger must still yield packages.
          baseline_rows="$(awk -F '\t' '!/^#/ && NF { n++ } END { print n+0 }' \
            dylints/enforce_platform_boundary/src/baseline.txt)"
          mapfile -t platform_packages < <(
            awk -F '\t' '!/^#/ && $1 ~ /^crates\// { split($1, parts, "/"); print parts[2] }' \
              dylints/enforce_platform_boundary/src/baseline.txt | sort -u
          )
          if test "$baseline_rows" -gt 0; then
            # Every data row must name a crate package, and the derived list
            # must be non-empty, or the filter above has stopped matching.
            test "$(awk -F '\t' '!/^#/ && NF && $1 !~ /^crates\// { n++ } END { print n+0 }' \
              dylints/enforce_platform_boundary/src/baseline.txt)" -eq 0
            test "${#platform_packages[@]}" -gt 0
          else
            echo "platform-boundary baseline is empty: no cross-target passes needed"
          fi
          targets=(x86_64-unknown-linux-gnu)
          if test "$ALL_TARGETS" = true; then
            shipping_targets="$(uv run --no-project python -c 'import tomllib; print(*tomllib.load(open("Cargo.toml", "rb"))["workspace"]["metadata"]["soldr"]["targets"], sep="\n")')"
            mapfile -t targets <<< "$shipping_targets"
          elif test "$FULL_TARGETS" = true && test "${#platform_packages[@]}" -gt 0; then
            targets+=(x86_64-pc-windows-msvc x86_64-apple-darwin)
          fi
          for triple in "${targets[@]}"; do
            cross_env=()
            if test "$ALL_TARGETS" = true && test "$triple" != x86_64-unknown-linux-gnu; then
              cross_env=(PYO3_CROSS=1 PYO3_CROSS_PYTHON_VERSION=3.10)
            fi
            if test "$ALL_TARGETS" = true || test "$triple" = x86_64-unknown-linux-gnu; then
              package_args=(--workspace)
            else
              package_args=()
              for package in "${platform_packages[@]}"; do
                package_args+=(--package "$package")
              done
            fi
            observed="$PWD/target/platform-boundary-dylint-observed-$triple.tsv"
            export FBUILD_PLATFORM_BOUNDARY_OBSERVED="$observed"
            rm -f "$observed"
            if ! env -u RUSTUP_TOOLCHAIN "${cross_env[@]}" soldr dylint --all -- "${package_args[@]}" --all-targets --target "$triple"; then
              status=1
              continue
            fi
            if ! uv run --no-project python ci/enforce_platform_boundary.py --dylint-observed "$observed" --print-totals; then
              status=1
            fi
          done
          test "$status" -eq 0
          # Soldr's successful marker uses a host-qualified nightly, while
          # setup-soldr expects the same compiler identity with a short name.
          # Check all fields before letting the action cache these outputs.
          identity="${SOLDR_DYLINT_CONFIGURED_TOOLCHAIN}|${SOLDR_DYLINT_CONFIGURED_RUSTC_RELEASE}|${SOLDR_DYLINT_CONFIGURED_RUSTC_COMMIT_HASH}"
          qualified="${SOLDR_DYLINT_CONFIGURED_TOOLCHAIN}-x86_64-unknown-linux-gnu|${SOLDR_DYLINT_CONFIGURED_RUSTC_RELEASE}|${SOLDR_DYLINT_CONFIGURED_RUSTC_COMMIT_HASH}"
          test "$(cat "$SOLDR_DYLINT_SUCCESS_MARKER")" = "$qualified"
          printf '%s\n' "$identity" > "$SOLDR_DYLINT_SUCCESS_MARKER"
  gate:
    name: Dylint
    if: always()
    needs: [policy, dylint]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Dylint jobs
        env:
          POLICY: ${{ needs.policy.result }}
          FULL_DYLINT: ${{ needs.dylint.result }}
        run: |
          test "$POLICY" = success
          test "$FULL_DYLINT" = success

  # GEN-022 (forge-ci/ci.yml#405): a merge-queue run ends with the cache
  # janitor, which needs every other job and never cancels a sweep.
  queue-cache-janitor:
    name: End-of-queue cache janitor
    needs: [policy, dylint, gate]
    # Only the standalone run sweeps; ci-minimal's call leaves it to ci-minimal.
    if: always() && github.event_name == 'merge_group' && github.workflow == 'Dylint'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: cache-janitor
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          sparse-checkout: ci.toml
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: zackees/ci.yml
          ref: 635fb1262b59702b9293a145e7201410612104e5
          path: .ci-lint
          persist-credentials: false
          sparse-checkout: ci_lint
      - name: Sweep caches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .ci-lint
        run: python3 -P -m ci_lint cache janitor --repo . --default-branch main
