name: Dylint

# The required PR Dylint status covers Linux host code quickly. ci-full and
# manual dispatch check Linux, Windows, and macOS targets on one Linux builder.

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  pull_request:
    branches: [main]
  # setup-soldr skips cache uploads on PRs. A main run seeds the shared
  # Dylint compile cache that subsequent PRs are allowed to restore.
  push:
    branches: [main]

# Auto-cancel superseded PR runs: pushing again to a feature branch
# supersedes the in-flight run instead of queueing behind it. Non-PR
# events key on run_id so each gets its own group -- a shared group keeps
# only ONE pending run, which would silently drop queued main SHAs.
concurrency:
  group: dylint.yml-${{ inputs.ref != '' && github.run_id || (github.event_name == 'pull_request' && github.ref || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token. Every step here reads: checkout, a shallow `git fetch
# origin main` for the shrink-only allowlist diff, and lint runs. Nothing
# writes, so nothing should be able to. Without this the job inherits the
# repository/organization default, which can include write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  policy:
    name: Dylint policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v3
      - name: Validate Dylint policy files
        run: |
          uv run --no-project python ci/check_dylint_allowlists.py
          uv run --no-project python ci/enforce_platform_boundary.py --print-totals

  dylint:
    name: Dylint Full (Linux builder, all OS targets)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v3
      - name: Validate Dylint allowlist paths
        run: uv run --no-project python ci/check_dylint_allowlists.py
      - name: Enforce shrink-only .fbuild allowlist
        # The baseline in dylints/ban_raw_fbuild_path may only shrink
        # (FastLED/fbuild#1349). Needs main fetched to diff against.
        run: |
          git fetch --no-tags --depth=1 origin main
          uv run --no-project python ci/check_fbuild_path_baseline.py --base FETCH_HEAD
      - name: Validate platform-boundary ledgers
        run: uv run --no-project python ci/enforce_platform_boundary.py --print-totals
      - uses: zackees/setup-soldr@v0
        with:
          # ci-tests applies the prescribed bounded resource contract for the
          # workspace validation domain. Dylint deliberately remains on its
          # separate pinned nightly/driver lifecycle in the explicit steps
          # below, so it cannot invalidate the stable target tree.
          cache: true
          save-cache: true
          cargo-registry-cache: true
          dylint: true
          dylint-cache: true
          dylint-foundation-cache: true
          # This layer keys by the whole source SHA, so every PR commit misses.
          # The lint-library cache below keys only the lint source tree.
          dylint-output-cache: false
          toolchain: 1.95.0
          # The old "dylint" key contains an immutable, empty build-cache
          # entry. Use a fresh stable key shared by main and future PRs.
          cache-key-suffix: dylint-unified-v2
          prebuild-deps: none
          ci-tests: true
          dylint-toolchain: nightly-2026-05-28
          cargo-dylint-version: 6.0.3
          dylint-link-version: 6.0.3
          # Opt out of the implicit `SOLDR_LINKER=fast` injection so cargo /
          # rust-toolchain.toml stays in charge. Silences the routine
          # "defaulting SOLDR_LINKER=fast" warning (issue #400 /
          # setup-soldr#377).
          linker: platform-default
          # Dylint's lint libraries pull in a full rustc-dev tree on first run
          # which can push the build-cache past the 512 MiB action default
          # (issue #400). Raise the soft warn threshold; hard cap stays
          # at the action default (6 GiB).
          cache-payload-warn-bytes: 2GiB
      - name: Prepare prebuilt Dylint tools and driver
        timeout-minutes: 10
        run: |
          env -u RUSTUP_TOOLCHAIN soldr dylint prepare 2>&1 | tee "$RUNNER_TEMP/dylint-prepare.log"
          # Library UI tests invoke soldr cargo test separately, so preserve
          # the prebuilt dylint-link directory for their linker config.
          sed -n 's/^soldr: dylint prepare: tool bin dir //p' "$RUNNER_TEMP/dylint-prepare.log" >> "$GITHUB_PATH"
      - name: Install cross-target nightly standard libraries
        if: ${{ inputs.ref != '' || github.event_name == 'workflow_dispatch' }}
        run: |
          soldr rustup target add --toolchain nightly-2026-05-28 \
            x86_64-pc-windows-msvc x86_64-apple-darwin
      - name: Check Dylint library formatting
        run: |
          while IFS= read -r manifest; do
            RUSTUP_TOOLCHAIN=nightly-2026-05-28 \
              soldr cargo fmt --manifest-path "$manifest" --all -- --check
          done < <(find dylints -mindepth 2 -maxdepth 2 -name Cargo.toml | sort)
      - name: Restore compiled Dylint libraries
        id: dylint_libraries_cache
        uses: actions/cache/restore@v5
        with:
          path: target/dylint/libraries/nightly-2026-05-28/release
          key: fbuild-dylint-libraries-v1-linux-nightly-2026-05-28-${{ hashFiles('dylints/**') }}
      - name: Test Dylint libraries
        # UI fixtures execute on the Linux host; workspace checks below use
        # the same host lint libraries against each platform target.
        run: |
          # UI fixtures test the lint implementations themselves. Repeating
          # all 27 suites on a workflow-only or application-only PR spends
          # minutes compiling their separate test-profile trees.
          if git diff --quiet FETCH_HEAD HEAD -- dylints; then
            echo "Dylint sources unchanged; skipping library UI fixtures"
            exit 0
          fi
          # UI fixtures launch nested Cargo. Keep the rustup proxy visible so
          # it can select each lint's pinned nightly.
          CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          CARGO_BIN="${CARGO_HOME}/bin"
          export PATH="${CARGO_BIN}:${PATH}"
          export CARGO_TARGET_DIR="$PWD/target/dylint-tests"
          # UI fixtures invoke Cargo outside soldr's Dylint front door.
          # Reuse the verified driver path exported by setup-soldr's Dylint
          # mode; it owns the driver cache outside SOLDR_CACHE_DIR.
          : "${DYLINT_DRIVER_PATH:?}"
          # Dylint's UI runner asks for the short nightly directory; Soldr's
          # verified asset lives under the host-qualified directory.
          host="$(RUSTUP_TOOLCHAIN=nightly-2026-05-28 soldr rustc -vV | sed -n 's/^host: //p')"
          short="nightly-2026-05-28"
          qualified="${short}-${host}"
          test -f "$DYLINT_DRIVER_PATH/$qualified/dylint-driver"
          test -d "${RUSTUP_HOME:?}/toolchains/$qualified"
          ln -sfnT "$qualified" "$DYLINT_DRIVER_PATH/$short"
          # The driver reads RUSTUP_HOME/toolchains/$RUSTUP_TOOLCHAIN
          # literally. Cargo's short nightly tag must resolve to the same
          # installed sysroot while keeping the lint library's short tag.
          ln -sfnT "$qualified" "$RUSTUP_HOME/toolchains/$short"
          while IFS= read -r manifest; do
            RUSTUP_TOOLCHAIN=nightly-2026-05-28 \
              soldr cargo test --manifest-path "$manifest"
          done < <(find dylints -mindepth 2 -maxdepth 2 -name Cargo.toml | sort)
      - name: Reuse cached Dylint library tree
        run: |
          # setup-soldr saves the short nightly path; Soldr writes a
          # host-qualified path. Point both names at one tree so warm runs
          # reuse the 27 compiled lint libraries without a copy over
          # read-only restored cache files. Do not cache the much larger
          # three-platform workspace target tree here.
          short="${SOLDR_DYLINT_CONFIGURED_TOOLCHAIN}"
          qualified="${short}-x86_64-unknown-linux-gnu"
          root="$PWD/target/dylint/libraries"
          mkdir -p "$root/$short"
          if test -L "$root/$qualified"; then
            test "$(readlink "$root/$qualified")" = "$short"
          else
            test ! -e "$root/$qualified"
            ln -s "$short" "$root/$qualified"
          fi
      - name: Run dylint over workspace
        env:
          FULL_TARGETS: ${{ inputs.ref != '' || github.event_name == 'workflow_dispatch' }}
        run: |
          status=0
          # The Linux pass covers the whole workspace. Cross-target passes
          # need only crates with target-specific source in the checked-in
          # boundary baseline; deriving this list makes new platform code
          # enter the cross-target check when its ledger is updated.
          mapfile -t platform_packages < <(
            awk -F '\t' '!/^#/ && $1 ~ /^crates\// { split($1, parts, "/"); print parts[2] }' \
              dylints/enforce_platform_boundary/src/baseline.txt | sort -u
          )
          test "${#platform_packages[@]}" -gt 0
          targets=(x86_64-unknown-linux-gnu)
          if test "$FULL_TARGETS" = true; then
            targets+=(x86_64-pc-windows-msvc x86_64-apple-darwin)
          fi
          for triple in "${targets[@]}"; do
            if test "$triple" = x86_64-unknown-linux-gnu; then
              package_args=(--workspace)
            else
              package_args=()
              for package in "${platform_packages[@]}"; do
                package_args+=(--package "$package")
              done
            fi
            observed="$PWD/target/platform-boundary-dylint-observed-$triple.tsv"
            export FBUILD_PLATFORM_BOUNDARY_OBSERVED="$observed"
            rm -f "$observed"
            if ! env -u RUSTUP_TOOLCHAIN soldr dylint --all -- "${package_args[@]}" --all-targets --target "$triple"; then
              status=1
              continue
            fi
            if ! uv run --no-project python ci/enforce_platform_boundary.py --dylint-observed "$observed" --print-totals; then
              status=1
            fi
          done
          test "$status" -eq 0
          # Soldr's successful marker uses a host-qualified nightly, while
          # setup-soldr expects the same compiler identity with a short name.
          # Check all fields before letting the action cache these outputs.
          identity="${SOLDR_DYLINT_CONFIGURED_TOOLCHAIN}|${SOLDR_DYLINT_CONFIGURED_RUSTC_RELEASE}|${SOLDR_DYLINT_CONFIGURED_RUSTC_COMMIT_HASH}"
          qualified="${SOLDR_DYLINT_CONFIGURED_TOOLCHAIN}-x86_64-unknown-linux-gnu|${SOLDR_DYLINT_CONFIGURED_RUSTC_RELEASE}|${SOLDR_DYLINT_CONFIGURED_RUSTC_COMMIT_HASH}"
          test "$(cat "$SOLDR_DYLINT_SUCCESS_MARKER")" = "$qualified"
          printf '%s\n' "$identity" > "$SOLDR_DYLINT_SUCCESS_MARKER"
      - name: Save compiled Dylint libraries
        if: steps.dylint_libraries_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: target/dylint/libraries/nightly-2026-05-28/release
          key: ${{ steps.dylint_libraries_cache.outputs.cache-primary-key }}

  gate:
    name: Dylint
    if: always()
    needs: [policy, dylint]
    runs-on: ubuntu-latest
    steps:
      - env:
          POLICY: ${{ needs.policy.result }}
          FULL_DYLINT: ${{ needs.dylint.result }}
        run: |
          test "$POLICY" = success
          test "$FULL_DYLINT" = success
