name: Build UNO R4 WiFi

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/uno_r4_wifi/**'
      - 'crates/fbuild-build-arm/src/renesas/**'
      - '.github/workflows/build-uno_r4_wifi.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/uno_r4_wifi/**'
      - 'crates/fbuild-build-arm/src/renesas/**'
      - '.github/workflows/build-uno_r4_wifi.yml'

concurrency:
  group: build-uno_r4_wifi.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "UNO R4 WiFi"
      test-dir: "tests/platform/uno_r4_wifi"
      env-name: "uno_r4_wifi"
      firmware-ext: "bin"
