name: Build BlackPill F411CE

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/blackpill_f411ce/**'
      - 'crates/fbuild-build-arm/src/stm32/**'
      - '.github/workflows/build-blackpill.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/blackpill_f411ce/**'
      - 'crates/fbuild-build-arm/src/stm32/**'
      - '.github/workflows/build-blackpill.yml'

concurrency:
  group: build-blackpill.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "BlackPill F411CE"
      test-dir: "tests/platform/blackpill_f411ce"
      env-name: "blackpill"
      firmware-ext: "hex"
