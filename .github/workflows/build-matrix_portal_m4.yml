name: Build Matrix Portal M4

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/matrix_portal_m4/**'
      - 'crates/fbuild-build-arm/src/sam/**'
      - '.github/workflows/build-matrix_portal_m4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/matrix_portal_m4/**'
      - 'crates/fbuild-build-arm/src/sam/**'
      - '.github/workflows/build-matrix_portal_m4.yml'

concurrency:
  group: build-matrix_portal_m4.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "Matrix Portal M4"
      test-dir: "tests/platform/matrix_portal_m4"
      env-name: "matrix_portal_m4"
      firmware-ext: "bin"
