name: Build Apollo3 expLoRaBLE

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/apollo3_thing_explorable/**'
      - 'crates/fbuild-build-arm/src/apollo3/**'
      - '.github/workflows/build-apollo3_thing_explorable.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/apollo3_thing_explorable/**'
      - 'crates/fbuild-build-arm/src/apollo3/**'
      - '.github/workflows/build-apollo3_thing_explorable.yml'

concurrency:
  group: build-apollo3_thing_explorable.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "Apollo3 expLoRaBLE"
      test-dir: "tests/platform/apollo3_thing_explorable"
      env-name: "apollo3_thing_explorable"
      firmware-ext: "bin"
