# Generated by ci/render_workflows.py from ci/board_families.json.
name: ci-test

on:
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-character commit SHA to validate'
        type: string
        required: true

concurrency:
  group: ci-test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-test')
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.sha.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha }}
          persist-credentials: false
      - id: sha
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'candidate_sha must be an exact 40-character commit SHA' >&2
            exit 1
          fi
          if [ "$EVENT_NAME" != pull_request ] && [ "$CANDIDATE_SHA" != "$WORKFLOW_SHA" ]; then
            echo "candidate $CANDIDATE_SHA differs from workflow revision $WORKFLOW_SHA; dispatch from a ref at the candidate commit" >&2
            exit 1
          fi
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$CANDIDATE_SHA" ]; then
            echo "checkout SHA $actual does not match $CANDIDATE_SHA" >&2
            exit 1
          fi
          echo "candidate_sha=$actual" >> "$GITHUB_OUTPUT"
  linux:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-test')
    needs: verify
    uses: ./.github/workflows/check-ubuntu.yml
    with:
      ref: ${{ needs.verify.outputs.candidate_sha }}
  fbuild_bin:
    name: Build fbuild (shared by board jobs)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-test')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
      SOLDR_TARGET_BLOCK_FREE_GB: "2"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.candidate_sha }}
          persist-credentials: false
      - uses: zackees/setup-soldr@3b3a7160b8ab4e0e1c22db756d476816d97c8edd
        with:
          cache-preset: foundation
          prebuild-deps-flags: ""
          prebuild-deps: none
          linker: platform-default
          cache-payload-warn-bytes: 2GiB
          cache-key-suffix: fbuild-rust-debug
          save-cache: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
      - run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 install -y libudev-dev pkg-config
      - run: soldr cargo build -p fbuild-cli -p fbuild-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: fbuild-bin-linux-debug
          path: |
            target/debug/fbuild
            target/debug/fbuild-daemon
          if-no-files-found: error
          retention-days: 1
  boards:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-test')
    needs: [verify, fbuild_bin]
    name: ${{ matrix.workflow_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - workflow: "build-uno.yml"
            workflow_name: "Arduino Uno"
            test_dir: "tests/platform/uno"
            env_name: "uno"
            firmware_ext: "hex"
            workflow_aliases: ["build-uno.yml"]
            toolchain_cache: false
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: ${{ matrix.workflow_name }}
      test-dir: ${{ matrix.test_dir }}
      env-name: ${{ matrix.env_name }}
      firmware-ext: ${{ matrix.firmware_ext }}
      checkout_ref: ${{ needs.verify.outputs.candidate_sha }}
      fbuild-artifact: fbuild-bin-linux-debug
      toolchain-cache: ${{ matrix.toolchain_cache }}
  coverage:
    name: ci-test coverage
    if: always()
    needs: [verify, boards, linux]
    runs-on: ubuntu-latest
    outputs:
      complete: ${{ steps.complete.outputs.complete }}
    steps:
      - id: complete
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABEL_PRESENT: ${{ contains(github.event.pull_request.labels.*.name, 'ci-test') }}
          VERIFY: ${{ needs.verify.result }}
          BOARDS: ${{ needs.boards.result }}
          LINUX: ${{ needs.linux.result }}
        run: |
          if [ "$EVENT_NAME" = pull_request ] && [ "$LABEL_PRESENT" != true ]; then
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            echo 'Optional tier is not selected on this PR; coverage is incomplete' >&2
            exit 1
          fi
          for result in "$VERIFY" "$BOARDS" "$LINUX"; do
            if [ "$result" != success ]; then
              echo "coverage incomplete: $result" >&2
              exit 1
            fi
          done
          echo 'complete=true' >> "$GITHUB_OUTPUT"
