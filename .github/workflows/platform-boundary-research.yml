name: Platform Boundary Research

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]

# Auto-cancel superseded PR runs: pushing again to a feature branch
# supersedes the in-flight run instead of queueing behind it. Non-PR
# events key on run_id so each gets its own group -- a shared group keeps
# only ONE pending run, which would silently drop queued main SHAs.
concurrency:
  group: platform-boundary-research.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  inventory:
    name: Inventory (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: linux
          - os: windows-latest
            host: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
      - uses: zackees/setup-soldr@v0
        with:
          version: 0.8.23
          cache: true
          toolchain: 1.95.0
          prebuild-deps: none
      - name: Check deterministic inventory
        run: uv run --no-project python ci/platform_boundary_research.py --check --host-label ${{ matrix.host }}
      - name: Run research scanner tests
        run: uv run --no-project python -m unittest ci.test_platform_boundary_research ci.test_enforce_platform_boundary ci.test_rust_toolchain_pins
      - name: Enforce exact boundary ledger and Rust pin consistency
        run: |
          uv run --no-project python ci/enforce_platform_boundary.py --print-totals
          uv run --no-project python ci/check_rust_toolchain_pins.py
      - name: Preserve RED compile evidence
        run: soldr rustc --edition 2021 -D warnings --crate-type lib --emit metadata ci/fixtures/platform_boundary/research_red_pass.rs
