name: Build RP2040

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
    paths:
      - 'tests/platform/rp2040/**'
      - 'crates/fbuild-build-arm/src/rp2040/**'
      - '.github/workflows/build-rp2040.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/platform/rp2040/**'
      - 'crates/fbuild-build-arm/src/rp2040/**'
      - '.github/workflows/build-rp2040.yml'

concurrency:
  group: build-rp2040.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "RP2040"
      test-dir: "tests/platform/rp2040"
      env-name: "rp2040"
      firmware-ext: "bin"
