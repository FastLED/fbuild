# Generated by ci/render_workflows.py from ci/board_families.json.
name: ci-minimal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, labeled, unlabeled, synchronize, reopened]
  merge_group:
  workflow_dispatch: {}

concurrency:
  group: ci-minimal-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cancel-superseded:
    name: Cancel superseded queue runs
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: ci/cancel_superseded.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Cancel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/cancel_superseded.py
  verify:
    name: Verify local gate
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
      - name: Verify source-bound local proof
        env:
          GATE_EVENT: ${{ github.event_name }}
        run: |
          if [ "$GATE_EVENT" = "pull_request" ]; then
            if ! uvx --from git+https://github.com/zackees/ci.yml@6711e4e418cf9b11de31e30e710b0bb1d9291e5b ci-lint local-gate verify --repo .; then
              echo "::warning::Optional local proof could not be verified; hosted CI provides validation."
            fi
          else
            echo "Local proof is advisory; hosted CI provides validation"
          fi
  linux:
    if: github.event_name != 'pull_request' || (!contains(github.event.pull_request.labels.*.name, 'ci-test') && !contains(github.event.pull_request.labels.*.name, 'ci-full'))
    uses: ./.github/workflows/check-ubuntu.yml
    secrets: inherit
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  board_plan:
    name: Select boards for changed paths
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci-test') && !contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git merge-base "$BASE" HEAD || true)
          matrix=$(cd ci && uv run --no-project python select_boards.py --matrix --base "$base" --head HEAD)
          echo "selected: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  fbuild_bin:
    name: Build fbuild (shared by board jobs)
    if: needs.board_plan.outputs.matrix != '[]'
    needs: board_plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
      SOLDR_TARGET_BLOCK_FREE_GB: "2"
      SOLDR_S3_CACHE_ACCESS_KEY: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
      SOLDR_S3_CACHE_SECRET_KEY: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: zackees/setup-soldr@45175ff1f8602ea18680729b6f3d2a225a76182a # canary: setup-soldr main (soldr 0.9.47, Dylint 6.2.0)
        with:
          s3-bucket: forge-ci-cache
          s3-endpoint: sfo3.digitaloceanspaces.com
          cache-preset: foundation
          prebuild-deps-flags: ""
          prebuild-deps: none
          linker: platform-default
          cache-payload-warn-bytes: 2GiB
          cache-key-suffix: fbuild-rust-debug
          save-cache: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
      - run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 install -y libudev-dev pkg-config
      - run: soldr cargo build -p fbuild-cli -p fbuild-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: fbuild-bin-linux-debug
          path: |
            target/debug/fbuild
            target/debug/fbuild-daemon
          if-no-files-found: error
          retention-days: 1
  pr_boards:
    name: ${{ matrix.workflow_name }}
    needs: [board_plan, fbuild_bin]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.board_plan.outputs.matrix) }}
    uses: ./.github/workflows/template_build.yml
    secrets: inherit
    with:
      workflow-name: ${{ matrix.workflow_name }}
      test-dir: ${{ matrix.test_dir }}
      env-name: ${{ matrix.env_name }}
      firmware-ext: ${{ matrix.firmware_ext }}
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      fbuild-artifact: fbuild-bin-linux-debug
      toolchain-cache: ${{ matrix.toolchain_cache }}
  reuse_decision:
    name: Verified reuse decision (shadow)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        continue-on-error: true
        timeout-minutes: 1
        with:
          repository: zackees/ci.yml
          ref: b93b8c4a20ce3cd476c75a278ad01a31bde2438b
          path: .ci-lint
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
        continue-on-error: true
        timeout-minutes: 1
      - name: Reuse decision (GEN-021, shadow)
        continue-on-error: true
        timeout-minutes: 2
        working-directory: .ci-lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project python -m ci_lint reuse-check
          --workflow ci-minimal.yml --mode shadow
          --required-job "linux / Check (ubuntu-latest)"
          --required-job "linux / Python facade tests (ubuntu-latest)"
          --required-job "CI selected coverage"
  test:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-test') && !contains(github.event.pull_request.labels.*.name, 'ci-full')
    uses: ./.github/workflows/ci-test.yml
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha }}
  full:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-full')
    uses: ./.github/workflows/ci-full.yml
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha }}
  selected-coverage:
    name: CI selected coverage
    if: always()
    needs: [linux, test, full, pr_boards]
    runs-on: ubuntu-latest
    steps:
      - env:
          LINUX: ${{ needs.linux.result }}
          TEST_SELECTED: ${{ contains(github.event.pull_request.labels.*.name, 'ci-test') }}
          TEST_RESULT: ${{ needs.test.result }}
          FULL_SELECTED: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}
          FULL_RESULT: ${{ needs.full.result }}
          FULL_COVERAGE: ${{ needs.full.outputs.coverage }}
          PR_BOARDS: ${{ needs.pr_boards.result }}
        run: |
          if [ "$FULL_SELECTED" = true ]; then
            test "$FULL_RESULT" = success
            test "$FULL_COVERAGE" = true
          elif [ "$TEST_SELECTED" = true ]; then
            test "$TEST_RESULT" = success
          else
            test "$LINUX" = success
            # Path-selected boards: skipped when the PR touches none.
            case "$PR_BOARDS" in success|skipped) ;; *) exit 1 ;; esac
          fi
  queue-cache-janitor:
    name: End-of-queue cache janitor
    needs: [cancel-superseded, verify, linux, board_plan, fbuild_bin, pr_boards, reuse_decision, test, full, selected-coverage]
    if: always() && github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: cache-janitor
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          sparse-checkout: ci.toml
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: zackees/ci.yml
          ref: 953c4e13691b10c1c4f1f9c39fa259fd732c5789
          path: .ci-lint
          persist-credentials: false
          sparse-checkout: ci_lint
      - name: Sweep caches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .ci-lint
        run: python3 -P -m ci_lint cache janitor --repo . --default-branch main
