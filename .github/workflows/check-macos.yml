name: Check macOS

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Verify candidate SHA
        env:
          CANDIDATE_SHA: ${{ inputs.ref }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: zackees/setup-soldr@v0
        with:
          cache: true
          build-cache: true
          target-cache: true
          prebuild-deps: none
          linker: platform-default
      - name: Test Rust workspace on macOS
        run: soldr cargo test --workspace
