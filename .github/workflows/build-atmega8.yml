name: Build ATmega8

# >>> RENDERED-ON-BEGIN (ci/render_workflows.py) -- do not edit by hand <<<
on:
  workflow_dispatch:
    inputs:
      fbuild-run-id:
        description: 'Run holding a prebuilt fbuild artifact (empty: compile here)'
        type: string
        default: ''
      checkout_ref:
        description: 'Commit to build (empty: the dispatched ref)'
        type: string
        default: ''
  workflow_call: {}

concurrency:
  group: build-atmega8.yml-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# >>> RENDERED-ON-END <<<

jobs:
  build:
    uses: ./.github/workflows/template_build.yml
    with:
      workflow-name: "ATmega8"
      test-dir: "tests/platform/atmega8"
      env-name: "atmega8"
      firmware-ext: "hex"
      checkout_ref: ${{ inputs.checkout_ref }}
      fbuild-artifact: ${{ inputs.fbuild-run-id && 'fbuild-bin-linux-debug' || '' }}
      fbuild-run-id: ${{ inputs.fbuild-run-id }}
